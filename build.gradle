plugins {
	/* AUTONOMIE 2026-07-27: von 1.15 angehoben — die veil-lib ist mit loom 1.16+
	 * gebaut, 1.15.5 kann deren mod-metadaten nicht remappen. Braucht gradle 9.6.1. */
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version + "-" + minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	maven {
		name = "Gegy"
		url = "https://maven.gegy.dev/"
	}

	/* AUTONOMIE 2026-07-27: MCEF (chromium-embedded) fuer BBSWebBridge. */
	maven {
		name = "CinemaMod"
		url = "https://mcef-download.cinemamod.com/repositories/releases"
	}
}

loom {
    splitEnvironmentSourceSets()

	mods {
		"bbs" {
			sourceSet sourceSets.main
		}
	}

	accessWidenerPath.set(getRootProject().file("src/main/resources/bbs.accesswidener"))

	/*
	 * Startet direkt in eine welt statt ins hauptmenue — spart bei jedem test das
	 * durchklicken von menue -> weltliste -> laden.
	 *
	 *   ./gradlew runQuick                 (welt "New World")
	 *   ./gradlew runQuick -Pwelt=<name>   (andere welt)
	 *
	 * Angelegt 2026-07-27: die UI-klickerei per bildschirm-koordinaten kostete pro test
	 * minuten und traf oft daneben (fenstergroesse verschiebt die pixel-positionen).
	 */
	runs {
		quick {
			client()
			configName = "Quick"

			/* AUTONOMIE 2026-07-27: mit -Pdebug oeffnet die instanz JDWP auf :5005.
			 *
			 *     ./gradlew runQuick -Pdebug
			 *
			 * Danach kann hotswap-cf.ps1 (oder IntelliJ) klassen live austauschen, ohne
			 * neustart. Ohne den schalter bleibt der port zu — JDWP kostet etwas leistung
			 * und soll nicht immer offen sein. suspend=n: das game wartet nicht auf einen
			 * debugger, es startet normal durch. */
			if (project.hasProperty("debug"))
			{
				vmArgs "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
			}

			/* ⭐ VOLLES HOTSWAP (2026-07-27 wiederhergestellt — war im alten fork eingerichtet).
			 *
			 * Mit der gebundelten JBR (../jbr-dcevm-home, 21.0.9-nomod) und dem hotswap-agent
			 * in deren lib/hotswap/ kann die laufende JVM NEUE METHODEN, FELDER UND KLASSEN
			 * aufnehmen — nicht nur methoden-rümpfe. Damit braucht ein feature-umbau keinen
			 * neustart mehr.
			 *
			 * ⛔ canAddMethod()/canUnrestrictedlyRedefineClasses() melden trotzdem `false`.
			 * Beide sind deprecated und sagen NICHTS über die echte fähigkeit — nie daran
			 * messen, immer eine echte klasse ändern und die wirkung im laufenden prozess
			 * prüfen. (Diese fehlmessung kostete uns einen tag, siehe CLAUDE.md regel 0d.)
			 *
			 * Auf einer stock-JVM werden die -XX-flags ignoriert; dann bleibt es bei
			 * body-hotswap. Deshalb ist die JBR über org.gradle.java.home fest gesetzt. */
			/* Die redefinition-flags stehen NICHT hier, sondern als JDK_JAVA_OPTIONS weiter
			 * unten am run-task — siehe die begruendung dort. Als vmArgs kommen sie beim
			 * game-prozess nicht an. */
			/* ⛔ KEIN -XX:HotswapAgent=fatjar. Das flag laedt den agent in den system-classloader;
			 * Minecrafts log4j sucht org.hotswap.agent.config.PluginManager dann ueber Knot und
			 * findet ihn nicht -> NoClassDefFoundError beim allerersten log-aufruf, das game
			 * startet gar nicht. Der fork, der gestern lief, setzt es auch nicht: die beiden
			 * AllowRedefinition-flags der JBR reichen fuer add-method/add-field. */


			vmArgs "--add-modules=jdk.jshell"
			programArgs "--quickPlaySingleplayer", (project.findProperty("welt") ?: "New World")
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
	/* MERGE 2026-07-27: aus dem CML-upstream — video-wiedergabe (VideoClip, VideoRenderer,
	 * VideoWaveformCache). Ohne die lib faellt der komplette video-clip-block weg. */
	modImplementation "maven.modrinth:watermedia:2.1.37"
	modImplementation "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
	modImplementation "maven.modrinth:iris:1.8.8+1.21.1-fabric"

	/* AUTONOMIE 2026-07-27: fremd-mods gegen die com/afrobama kompiliert.
	 * Alle modCompileOnly — sie werden NICHT gebuendelt und NICHT zur laufzeit verlangt;
	 * die betroffenen features (Veil-FX, PhysicsMod-fracture, accelerated crowd-rendering,
	 * MCEF-webbridge) pruefen selbst per FabricLoader.isModLoaded() und schalten sich ab.
	 * Die jars liegen in libs/. */
	modCompileOnly fileTree(dir: "libs", include: ["veil-fabric*.jar"])
	modCompileOnly fileTree(dir: "libs", include: ["acceleratedrendering*.jar"])
	modCompileOnly files("libs/physics-mod-pro-v172j-fabric-1.21.1.jar")
	modCompileOnly files("libs/worldedit-mod-7.3.8.jar")
	modCompileOnly "com.cinemamod:mcef:2.1.6-1.21.1"

	/* AUTONOMIE 2026-07-27: audio-decoder fuer com/afrobama/bbstools/audio
	 * (MASFlacReader, MASMp3Reader) — liest FLAC/MP3 fuer die lipsync-/waveform-spur.
	 * include() = wird in den jar gebuendelt, sonst fehlt sie zur laufzeit. */
	implementation include("org.jflac:jflac-codec:1.5.2")
	implementation include("com.googlecode.soundlibs:jlayer:1.0.1.4")

	modImplementation "org.anarres:jcpp:1.4.14"
	modImplementation "io.github.douira:glsl-transformer:2.0.0-pre13"
}

/* ⭐ VOLLES HOTSWAP — die JBR NUR fuer den game-lauf, nicht fuer den build.
 *
 * WARUM NICHT org.gradle.java.home: das wuerde auch gradle+loom auf die JBR umstellen.
 * Loom cached mappings und remap-ergebnisse pro JVM — ein wechsel loest einen kompletten
 * neubau aus und provoziert fabric-loader-fehler, weil die caches nicht zusammenpassen.
 * Der build bleibt deshalb auf der gewohnten JVM; nur der gestartete client laeuft auf
 * der JBR, und nur DIE braucht die redefinition-faehigkeit.
 *
 * Greift automatisch, wenn ../jbr-dcevm-home existiert — sonst laeuft alles wie bisher
 * (dann eben nur body-hotswap statt vollem).
 */
tasks.matching { it.name == "runQuick" || it.name == "runClient" }.configureEach {
	def jbr = file("${rootDir}/../jbr-dcevm-home/bin/java.exe")

	if (jbr.exists())
	{
		it.executable = jbr.absolutePath

		/* ⛔ Die -XX-flags MUESSEN ueber JDK_JAVA_OPTIONS kommen, nicht ueber vmArgs.
		 *
		 * GEMESSEN 2026-07-27: loom startet den client nicht direkt, sondern ueber
		 * net.fabricmc.devlaunchinjector.Main mit einer launch.cfg. Dessen JVM erbt die
		 * vmArgs NICHT — im laufenden game meldete
		 * ManagementFactory.getRuntimeMXBean().getInputArguments() nur die -D-properties,
		 * und redefineClasses scheiterte an "schema change not implemented", obwohl die
		 * flags auf der prozess-kommandozeile standen.
		 *
		 * JDK_JAVA_OPTIONS liest JEDE JVM der kette beim start — damit kommen sie an. */
		it.environment "JDK_JAVA_OPTIONS",
			"-XX:+AllowEnhancedClassRedefinition -XX:+AllowRedefinitionToAddDeleteMethods"

		it.doFirst { logger.lifecycle("[hotswap] client auf JBR + volle redefinition: ${jbr.absolutePath}") }
	}
	else
	{
		it.doFirst { logger.lifecycle("[hotswap] ../jbr-dcevm-home fehlt — nur body-hotswap moeglich") }
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}