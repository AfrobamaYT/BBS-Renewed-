/* ⭐ VOLLES HOTSWAP — die JBR NUR fuer den game-lauf, nicht fuer den build.
 *
 * WARUM NICHT org.gradle.java.home: das wuerde auch gradle+loom auf die JBR umstellen.
 * Loom cached mappings und remap-ergebnisse pro JVM — ein wechsel loest einen kompletten
 * neubau aus und provoziert fabric-loader-fehler, weil die caches nicht zusammenpassen.
 * Der build bleibt deshalb auf der gewohnten JVM; nur der gestartete client laeuft auf
 * der JBR, und nur DIE braucht die redefinition-faehigkeit.
 *
 * Greift automatisch, wenn ../jbr-dcevm-home existiert — sonst laeuft alles wie bisher
 * (dann eben nur body-hotswap statt vollem).
 */
tasks.matching { it.name == "runQuick" || it.name == "runClient" }.configureEach {
	/* V1-Messung: ./gradlew runQuick -Prenderdoc laedt librenderdoc in die CLIENT-JVM
	 * (LD_PRELOAD ueber die gradle-kette wird gestrippt — hier ist der einzige ort). */
	if (project.hasProperty("renderdoc")) {
		it.environment("LD_PRELOAD", "/usr/lib/librenderdoc.so")
		it.doFirst { logger.lifecycle("[renderdoc] librenderdoc.so in die client-jvm geladen (F12 = capture)") }
	}
	/* V1: ./gradlew runQuick -Papitrace zeichnet ALLE GL-Calls der Client-JVM auf
	 * (apitrace dump zum Lesen); TRACE_FILE steuert den Ablageort. */
	if (project.hasProperty("apitrace")) {
		it.environment("LD_PRELOAD", "/usr/lib/apitrace/wrappers/glxtrace.so")
		it.environment("TRACE_FILE", project.findProperty("apitrace") ?: "/tmp/bbs-v1.trace")
		it.doFirst { logger.lifecycle("[apitrace] glxtrace.so aktiv -> ${project.findProperty("apitrace") ?: "/tmp/bbs-v1.trace"}") }
	}

	/* WELCHE JBR — umschaltbar, weil der 26.2-port zwei braucht (2026-07-30).
	 *
	 * Der pfad stand hier fest verdrahtet. Fuer P1 des ports (beweisen, dass DCEVM auch auf
	 * Java 25 traegt) muss zwischen 21 und 25 hin und her geschaltet werden — und zwar mit
	 * demselben spiel, damit der vergleich etwas wert ist. Eine datei dafuer jedes mal zu
	 * editieren ist genau die reibung, die man einmal beseitigt statt zwanzigmal ertraegt.
	 *
	 *     ./gradlew runClient                          -> ../jbr25-dcevm-home  (25, ab 26.2)
	 *     ./gradlew runClient -Pbbs.jbr=jbr-dcevm-home   (21, fuer vergleiche)
	 *
	 * ⚠️ DER DEFAULT IST AM 2026-07-31 AUF 25 GEDREHT WORDEN, und zwar nicht aus vorliebe:
	 * 26.2 LAEUFT AUF JAVA 21 GAR NICHT. Der erste boot des ports scheiterte daran, gemessen
	 * am loader:
	 *
	 *     Mod 'Fabric API' (fabric-api) 0.156.0+26.2 requires version 25 or later of
	 *     'OpenJDK 64-Bit Server VM' (java), but only the wrong version is present: 21!
	 *
	 * Der compile zielte laengst auf 25 (release = 25 weiter unten), nur die LAUFZEIT hing
	 * noch auf der alten JBR -- eine haelfte umgestellt, die andere vergessen. Die 21er bleibt
	 * ueber -Pbbs.jbr erreichbar, fuer den fall dass jemand die zwei vergleichen will. */
	/* ⛔ DER BINAERNAME IST PLATTFORMABHAENGIG (2026-08-07, umzug auf linux).
	 * Hier stand fest `bin/java.exe`. Unter linux heisst die datei `bin/java`, also war
	 * jbr.exists() IMMER falsch — der client waere still auf der system-JVM gestartet und
	 * der else-zweig unten haette "nur body-hotswap moeglich" gemeldet, obwohl die JBR
	 * vollstaendig danebenlag. Ein fehlender exe-suffix, der wie ein fehlendes feature
	 * aussieht: genau die sorte fehldiagnose, die hier schon monate gekostet hat. */
	def jbrBin = System.getProperty("os.name").toLowerCase().contains("windows") ? "java.exe" : "java"
	def jbrAngabe = project.findProperty("bbs.jbr")
	def jbrHome

	if (jbrAngabe)
	{
		def angegeben = file(jbrAngabe.toString())
		jbrHome = angegeben.isAbsolute() ? angegeben : file("${rootDir}/../${jbrAngabe}")
	}
	else
	{
		/* Worktrees liegen nicht zwingend neben der JBR. gradle.properties kennt den
		 * tatsaechlichen absoluten Pfad bereits; denselben Stand auch fuer den Client
		 * verwenden, statt still auf die eingeschraenkte Standard-JVM-Konfiguration
		 * zurueckzufallen. */
		def gradleJavaHome = project.findProperty("org.gradle.java.home")
		def eingestellt = gradleJavaHome ? file(gradleJavaHome.toString()) : null
		jbrHome = eingestellt != null && eingestellt.isDirectory()
			? eingestellt : file("${rootDir}/../jbr25-dcevm-home")
	}

	def jbr = new File(jbrHome, "bin/${jbrBin}")

	/* ⛔ HEAP-DECKEL, WEIL ES OHNE IHN KEINEN GIBT (2026-08-02, user-order nach RAM-defekt).
	 *
	 * Es stand NIRGENDS ein -Xmx fuer den client — nur der gradle-daemon hatte einen
	 * (gradle.properties, 4G). Ohne -Xmx nimmt die JVM ein VIERTEL des physischen RAM:
	 * auf dieser 32-GB-maschine also 8 GB JE INSTANZ. Bei referenz + patient + quick sind
	 * das 24 GB, die sich das spiel nehmen DARF — neben Cyberpunk und den werkzeugen.
	 * Anlass war handfest: zwei 16-GB-riegel sind tot, die maschine bleibt bei 32 GB.
	 *
	 * Umstellbar ohne die datei anzufassen, wie bei bbs.jbr:
	 *
	 *     ./gradlew runClient                      -> 3G
	 *     ./gradlew runClient -Pbbs.heap=2G        -> 2G  (kleine testwelt, sichtweite 2)
	 *     ./gradlew runClient -Pbbs.heap=6G        -> 6G  (wenn eine messung mehr braucht)
	 *
	 * ⚠️ WARUM JDK_JAVA_OPTIONS UND NICHT vmArgs: derselbe grund wie bei den -XX-flags
	 * unten — loom startet ueber net.fabricmc.devlaunchinjector.Main, und diese JVM erbt
	 * vmArgs NICHT. Ein -Xmx dort waere still wirkungslos geblieben und haette wie ein
	 * fix ausgesehen. Gegenprobe im laufenden spiel:
	 *
	 *     python tools/dev.py ev 'Runtime.getRuntime().maxMemory() / 1048576'
	 *
	 * Der wert steht AUSSERHALB des jbr-zweigs, weil der deckel auch dann gelten muss,
	 * wenn die JBR fehlt — sonst haengt die speichergrenze an einer hotswap-frage. */
	def heap = project.findProperty("bbs.heap") ?: "3G"
	def jvmOptionen = ["-Xmx${heap}"]

	/* Zusaetzliche JVM-flags fuer messreihen, z.B. -Pbbs.jvm=-XX:+UseSerialGC
	 *
	 * ⛔ WOFUER: am 2026-08-02 starb die JVM DREIMAL an derselben adresse
	 * (ChangePointersObjectClosure::do_object, jvmtiEnhancedRedefineClasses.cpp) beim
	 * redefine der FilmController-hierarchie. Der stack ist reines G1
	 * (G1ParallelObjectIterator), und DCEVM erzwang urspruenglich SERIAL GC — die
	 * groessenveraendernden GC-eingriffe stecken nur im mark-and-compact-algorithmus.
	 * Ohne diesen schalter liesse sich die naheliegendste gegenprobe gar nicht fahren:
	 * dieselbe reihe einmal unter G1 und einmal unter Serial.
	 *
	 * Bewusst allgemein gehalten und ohne vorgabe — ein GC still umzustellen waere eine
	 * verhaltensaenderung, die niemand beauftragt hat. */
	def extra = project.findProperty("bbs.jvm")

	if (extra)
	{
		jvmOptionen += extra.toString().split(" ").findAll { it }
		it.doFirst { logger.lifecycle("[jvm] zusatz-flags: ${extra}") }
	}

	if (jbr.exists())
	{
		it.executable = jbr.absolutePath

		/* ⛔ Die -XX-flags MUESSEN ueber JDK_JAVA_OPTIONS kommen, nicht ueber vmArgs.
		 *
		 * GEMESSEN 2026-07-27: loom startet den client nicht direkt, sondern ueber
		 * net.fabricmc.devlaunchinjector.Main mit einer launch.cfg. Dessen JVM erbt die
		 * vmArgs NICHT — im laufenden game meldete
		 * ManagementFactory.getRuntimeMXBean().getInputArguments() nur die -D-properties,
		 * und redefineClasses scheiterte an "schema change not implemented", obwohl die
		 * flags auf der prozess-kommandozeile standen.
		 *
		 * JDK_JAVA_OPTIONS liest JEDE JVM der kette beim start — damit kommen sie an. */
		jvmOptionen += ["-XX:+AllowEnhancedClassRedefinition",
		                "-XX:+AllowRedefinitionToAddDeleteMethods"]

		/* ⛔ OHNE DAS STIRBT DIE JVM NACH HOTSWAPS (ciMethod.cpp:749 "old method not detected").
		 * DCEVM tauscht die Klasse aus, die Typprofile (MethodData) zeigen aber weiter auf die
		 * ALTE Fassung; C2 sagt per PredictedCallGenerator genau diese voraus, inlined sie und
		 * stolpert in find_monomorphic_target ueber alte Methoden. JBR hat die Profil-Bereinigung
		 * im Quelltext auskommentiert (MethodDataCleaner, FIXME). -UseTypeProfile laesst C2
		 * Empfaengerprofile ignorieren; C2 und CHA bleiben an.
		 * Gemessen 2026-10-12, run_31 unter Last (Film laeuft, Regie-Liste sichtbar):
		 *   ohne Flag 2 von 8 Tauschen tot (beide PredictedCallGenerator im hs_err),
		 *   mit Flag 0 von 16. Ein Bildraten-Preis war im Rauschen nicht erkennbar. */
		jvmOptionen += ["-XX:-UseTypeProfile"]

		it.doFirst { logger.lifecycle("[hotswap] client auf JBR + volle redefinition: ${jbr.absolutePath}") }
	}
	else
	{
		/* Den GESUCHTEN pfad nennen, nicht einen fest getippten. Vorher stand hier immer
		 * "../jbr-dcevm-home", auch wenn nach jbr25-dcevm-home gesucht wurde — die meldung
		 * schickte damit auf die falsche faehrte. */
		it.doFirst { logger.lifecycle("[hotswap] ${jbr} fehlt — nur body-hotswap moeglich") }
	}

	it.environment "JDK_JAVA_OPTIONS", jvmOptionen.join(" ")

	/* ⛔ RENDERDOC BRAUCHT LD_PRELOAD, dlopen aus Java reicht NICHT (2026-08-11 gemessen).
	 * Der Fabric-Preloader (-Dbbstools.renderdoc.preload=true) laedt librenderdoc.so per
	 * dlopen und meldet sauber "ATTACHED — API v1.7.0". TriggerCapture feuert danach auch,
	 * das Instanz-Log sagt "next frame will be captured" — und es entsteht NICHTS:
	 * getNumCaptures bleibt 0, kein .rdc, und RenderDocs eigenes Log endet nach
	 * "Registering OpenGL hooks" ohne eine einzige Mitschnitt-Zeile. Die Hooks kommen zu
	 * spaet an den schon erzeugten GL-Kontext. Genau davor warnt der Kopf des Preloaders.
	 * Mit LD_PRELOAD sitzen sie vor dem ersten GL-Aufruf.
	 *
	 *     ./gradlew runQuick -Pbbs.ldpreload=/usr/lib/librenderdoc.so
	 *
	 * Nur setzen, wenn gefragt — dauerhaft eingehaengt kostet es Leistung und faengt
	 * jeden Lauf ab. */
	def vorladen = project.findProperty("bbs.ldpreload")

	if (vorladen)
	{
		it.environment "LD_PRELOAD", vorladen.toString()
		it.doFirst { logger.lifecycle("[renderdoc] LD_PRELOAD=${vorladen}") }
	}

	it.doFirst { logger.lifecycle("[speicher] heap-deckel ${heap} (umstellen mit -Pbbs.heap=<wert>)") }
}

processResources {
	inputs.property "version", project.version

	/* Die Resolve-Seite des DaVinci-Links (Aufgabe 79) reist im Mod mit; DavinciScriptInstall
	 * legt sie in Resolves Skriptordner. Eine Quelle, kein Kopierschritt von Hand. */
	from("davinci") {
		include "bbs_link.py"
		into "assets/bbs/davinci"
	}
	inputs.property "physicsMod", physicsModJar.exists()

	filesMatching("fabric.mod.json") {
		expand "version": project.version

	}

	/* Ohne das Physics-Mod-jar sind die drei mixins nicht kompiliert — dann darf ihre
	 * konfiguration auch nicht in fabric.mod.json stehen, sonst sucht Mixin beim start
	 * nach klassen (samt mixin-plugin), die es nicht gibt. Als JSON-umbau, nicht als
	 * zeilenfilter: der eintrag ist ein objekt ueber mehrere zeilen. */
	doLast {
		if (!physicsModJar.exists()) {
			def datei = new File(destinationDir, "fabric.mod.json")
			def daten = new groovy.json.JsonSlurper().parse(datei)
			daten.mixins = daten.mixins.findAll { eintrag ->
				!((eintrag instanceof Map ? eintrag.config : eintrag).toString().contains("physicsmod"))
			}
			datei.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(daten))
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25

	/* ⛔ DECKEL HOCH, SOLANGE DER PORT LAEUFT (2026-07-30).
	 *
	 * javac bricht nach 100 fehlern ab und schreibt "100 Fehler". Das ist ein DECKEL, keine
	 * messung — und wer ihn als umfang meldet, meldet einen zaehler statt einer zahl. Beim
	 * mappings-umzug stand dort zweimal 100, einmal waren es in wahrheit 2 (nach dem
	 * classpath-wechsel) und einmal deutlich mehr. Ohne diese zeile weiss man nie, welches
	 * von beidem man gerade vor sich hat.
	 *
	 * Kostet im gruenen zustand nichts: wo keine fehler sind, gibt es nichts zu zaehlen. */
	it.options.compilerArgs << "-Xmaxerrs" << "10000"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	/* ⛔ 25, WEIL MC 26.2 ES VERLANGT (P3, 2026-07-30). Die toolchain unten sagt gradle,
	 * WOMIT es das uebersetzt — ohne sie versucht javac 21 auf release 25 zu zielen und
	 * scheitert mit "release version 25 not supported". */
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from(["LICENSE.md", "COPYING"]) {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
/* ⭐ CLIENT-GAMETESTS MIT SCREENSHOT-VERGLEICH (2026-08-03).
 *
 * WOFUER: beweis.py vergleicht Bilder mit selbst gebauter Schwellenlogik. Fabric bringt
 * genau das seit 1.21.5 mit -- geprueft, die Klassen liegen im Klassenpfad:
 *   TestScreenshotComparisonOptions   of() withRegion(4) withSize(2) withGrayscale()
 *                                     meanSquaredDifference(1) findColor(2)
 * findColor kann sogar MEHR als mein Eigenbau: es sucht eine Farbe im Bild. Damit waere der
 * orange Umriss direkt lokalisierbar gewesen, statt Koordinaten von Hand abzulesen.
 *
 * createSourceSet keeps the test classes out of the product JAR. check compiles
 * the suite; explicit production-client tasks execute its graphical cases. */
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "bbs-gametest"
		/* Only fabric-client-gametest entrypoints are registered in this suite. */
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

/* Compile the registered client suite during check; graphical runs stay explicit. */
tasks.named("check") { dependsOn tasks.named("gametestClasses") }

/* Client resource tasks exist after Loom's split source-set setup. */
apply from: 'gradle/nanovg-natives.gradle'
