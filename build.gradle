plugins {
	/* AUTONOMIE 2026-07-27: von 1.15 angehoben — die veil-lib ist mit loom 1.16+
	 * gebaut, 1.15.5 kann deren mod-metadaten nicht remappen. Braucht gradle 9.6.1. */
	id 'net.fabricmc.fabric-loom' version '1.17.17'
	id 'maven-publish'
}

version = project.mod_version + "-" + minecraft_version
group = project.maven_group

// Explicit device selection also chooses the matching development shader mods.
def bbsGraphics = project.findProperty("bbs.graphics")?.toString()
if (bbsGraphics != null && !(bbsGraphics in ["opengl", "vulkan"])) {
	throw new GradleException("bbs.graphics must be opengl or vulkan")
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	maven {
		name = "Gegy"
		url = "https://maven.gegy.dev/"
	}

	/* AUTONOMIE 2026-07-27: MCEF (chromium-embedded) fuer BBSWebBridge. */
	maven {
		name = "CinemaMod"
		url = "https://mcef-download.cinemamod.com/repositories/releases"
	}
}

loom {
    splitEnvironmentSourceSets()

	mods {
		"bbs" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	/* 2026-07-31 WIEDER AN. Er war stillgelegt mit der Begruendung, 26.x habe das FORMAT
	 * ersetzt (classTweaker statt accessWidener v2). Das stimmt nicht: Fabrics eigene Datei
	 * traegt in 26.2 unveraendert `accessWidener v2 official`. Der erste Boot scheiterte an
	 * etwas anderem -- der Kopf stand auf Zeile 6 statt auf Zeile 1, weil ein Kommentarblock
	 * davor gerutscht war. Die Fehlermeldung nannte das neue Format und schickte damit in die
	 * falsche Richtung; Begruendung steht jetzt in der Datei selbst.
	 *
	 * Von sechs Eintraegen ist einer uebrig (ModelPart.children fuer den Blender-Export) --
	 * die anderen fuenf zeigten auf Gestrichenes. */
	accessWidenerPath.set(getRootProject().file("src/main/resources/bbs.accesswidener"))

	/*
	 * Ports der DEV-instanz — bewusst NEBEN denen der CurseForge-instanz.
	 *
	 * CF laeuft auf den defaults (studio 7900, bridge 9880, jdwp 5005). Die dev-instanz
	 * liegt daneben, damit beide gleichzeitig laufen koennen: der nutzer arbeitet in CF,
	 * waehrend hier gemessen wird. Ohne diese trennung band die zweite instanz still
	 * nichts und jede messung ging an die falsche JVM.
	 */
	ext.devPorts = [
		studio: project.findProperty("studioPort") ?: 7901,
		bridge: project.findProperty("bridgePort") ?: 9881,
		jdwp  : project.findProperty("jdwpPort")   ?: 5006,
	]

	/*
	 * Startet direkt in eine welt statt ins hauptmenue — spart bei jedem test das
	 * durchklicken von menue -> weltliste -> laden.
	 *
	 *   ./gradlew runQuick                 (welt "New World")
	 *   ./gradlew runQuick -Pwelt=<name>   (andere welt)
	 *
	 * Angelegt 2026-07-27: die UI-klickerei per bildschirm-koordinaten kostete pro test
	 * minuten und traf oft daneben (fenstergroesse verschiebt die pixel-positionen).
	 */
	runs {
		client {
			if (bbsGraphics != null) {
				programArgs "--graphicsBackend", bbsGraphics
			}
			if (project.hasProperty("bbs.vulkanValidation")) {
				programArgs "--vulkanValidation"
			}
		}
		quick {
			client()
			configName = "Quick"

			if (bbsGraphics != null) {
				programArgs "--graphicsBackend", bbsGraphics
			}
			if (project.hasProperty("bbs.vulkanValidation")) {
				programArgs "--vulkanValidation"
			}

			/* AUTONOMIE 2026-07-27: mit -Pdebug oeffnet die instanz JDWP auf :5005.
			 *
			 *     ./gradlew runQuick -Pdebug
			 *
			 * Danach kann hotswap-cf.ps1 (oder IntelliJ) klassen live austauschen, ohne
			 * neustart. Ohne den schalter bleibt der port zu — JDWP kostet etwas leistung
			 * und soll nicht immer offen sein. suspend=n: das game wartet nicht auf einen
			 * debugger, es startet normal durch. */
			if (project.hasProperty("debug"))
			{
				vmArgs "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${devPorts.jdwp}"
			}

			/*
			 * ⛔ EIGENE PORTS FUER DIE DEV-INSTANZ (2026-07-27, teuer gelernt).
			 *
			 * Unser mod startet seine server in JEDER instanz — auch in der CurseForge-instanz,
			 * in der der nutzer arbeitet. Beide griffen nach denselben ports, also gewann wer
			 * zuerst da war: die dev-instanz startete, band nichts, lief aber weiter, und JEDE
			 * messung ging still an die CF-instanz mit ihrem ALTEN klassenstand. Ich suchte den
			 * fehler eine halbe stunde im code (route "fehlte", EXEC "deaktiviert") — er lag im
			 * port-konflikt. Schlimmer: beim aufraeumen haette ich fast die arbeitsinstanz des
			 * nutzers gekillt.
			 *
			 * Die properties existierten laengst (mcstudio.port, blenderbridge.port) und waren
			 * genau dafuer gedacht ("dev-instanz-koexistenz") — sie wurden nur nie gesetzt.
			 *
			 * Ueberschreibbar: ./gradlew runQuick -PstudioPort=7902 -PbridgePort=9882
			 * HttpDebugServer (7777) braucht nichts — der sucht sich selbst einen freien port.
			 */
			property "mcstudio.port", devPorts.studio.toString()
			property "blenderbridge.port", devPorts.bridge.toString()
			/* DaVinci-Link: Testinstanzen installieren ihr Resolve-Skript nur in einen eigenen
			 * Ordner, nie in Resolves echten (DavinciScriptInstall). */
			if (project.hasProperty("davinciScripts")) {
				property "davincilink.scripts", project.property("davinciScripts").toString()
			}

			/* ⭐ VOLLES HOTSWAP (2026-07-27 wiederhergestellt — war im alten fork eingerichtet).
			 *
			 * Mit der gebundelten JBR (../jbr-dcevm-home, 21.0.9-nomod) und dem hotswap-agent
			 * in deren lib/hotswap/ kann die laufende JVM NEUE METHODEN, FELDER UND KLASSEN
			 * aufnehmen — nicht nur methoden-rümpfe. Damit braucht ein feature-umbau keinen
			 * neustart mehr.
			 *
			 * ⛔ canAddMethod()/canUnrestrictedlyRedefineClasses() melden trotzdem `false`.
			 * Beide sind deprecated und sagen NICHTS über die echte fähigkeit — nie daran
			 * messen, immer eine echte klasse ändern und die wirkung im laufenden prozess
			 * prüfen. (Diese fehlmessung kostete uns einen tag, siehe CLAUDE.md regel 0d.)
			 *
			 * Auf einer stock-JVM werden die -XX-flags ignoriert; dann bleibt es bei
			 * body-hotswap. Deshalb ist die JBR über org.gradle.java.home fest gesetzt. */
			/* Die redefinition-flags stehen NICHT hier, sondern als JDK_JAVA_OPTIONS weiter
			 * unten am run-task — siehe die begruendung dort. Als vmArgs kommen sie beim
			 * game-prozess nicht an. */
			/* ⛔ KEIN -XX:HotswapAgent=fatjar. Das flag laedt den agent in den system-classloader;
			 * Minecrafts log4j sucht org.hotswap.agent.config.PluginManager dann ueber Knot und
			 * findet ihn nicht -> NoClassDefFoundError beim allerersten log-aufruf, das game
			 * startet gar nicht. Der fork, der gestern lief, setzt es auch nicht: die beiden
			 * AllowRedefinition-flags der JBR reichen fuer add-method/add-field. */

			/* jdk.jshell für den blenderbridge-EXEC-kanal (in-JVM REPL). Ohne das modul
			 * meldet EXEC "jdk.jshell unavailable" statt zu funktionieren. */
			vmArgs "--add-modules=jdk.jshell"

			/*
			 * ⭐ MIXIN-HOTSWAP (2026-07-29, user-order „will nie wieder restarts sehen").
			 *
			 * Die MixinBruecke macht die LOGIK eines Handlers hotswapbar, nicht die WEBUNG.
			 * Neues Mixin, anderer Injection Point, geänderte Handler-Signatur kosteten
			 * deshalb weiterhin einen Boot — der letzte verbliebene Boot-Grund.
			 *
			 * Mixin bringt dagegen ein eigenes Werkzeug mit, das nie eingeschaltet war:
			 * `org.spongepowered.tools.agent.MixinAgent` steckt im sponge-mixin-jar, das
			 * ohnehin auf dem Classpath liegt, und dessen Manifest trägt Agent-Class,
			 * Premain-Class, Can-Redefine-Classes und Can-Retransform-Classes. Mit
			 * `mixin.hotSwap=true` DEFINIERT der Mixin-Prozessor die Mixin-Klassen als
			 * echte JVM-Klassen; erst dann kann JDWP sie redefinieren, und der Agent webt
			 * die Zielklassen daraufhin neu.
			 *
			 * ⛔ NACHTRÄGLICH ANHÄNGEN REICHT NICHT — gemessen: der Agent lässt sich per
			 * Attach-API an die laufende JVM hängen (`ANGEHAENGT`, Instanz lief weiter),
			 * aber die Mixin-Klassen waren da längst nicht als JVM-Klassen definiert
			 * (`ungeladen (kommt beim ersten zugriff frisch)`), also gab es nichts zu
			 * redefinieren. Die Eigenschaft muss beim START stehen.
			 *
			 * ⭐ BELEGT AM 2026-07-29 AN DER TEST-INSTANZ, die ganze Kette:
			 *   1. `mixin.hotSwap = true` steht (ohne Agent-Boot: null).
			 *   2. `hotswap.ps1 <MixinKlasse>` meldet `REDEFINED: 1 klasse(n)`.
			 *      Dieselbe Klasse in der Instanz OHNE Agent: `ungeladen`.
			 *   3. Der Agent protokolliert die Neu-Webung:
			 *      `(FabricLoader/Mixin/agent) Redefining mixin com/afrobama/.../…Mixin`
			 *   4. WIRKUNG: der gewobene Handler rief danach einen Klassennamen, den es erst
			 *      im NACH dem Boot kompilierten Quelltext gab — nachgewiesen über eine neue
			 *      Brückenmeldung. Kein Neustart.
			 *
			 * Deshalb STANDARD AN (User-Order 2026-07-29: „will nie wieder restarts sehen").
			 * Abschalten, falls der Agent je im Weg steht:  ./gradlew runQuick -PkeinMixinHotswap
			 */
			if (!project.hasProperty("keinMixinHotswap") && rootProject.file("dev").isDirectory())
			{
				/* ⛔ NICHT ÜBER EINE PROJEKT-KONFIGURATION. Der jar hängt an fabric-loader
				 * und steht auf LOOMS launch-classpath, nicht in compileClasspath oder
				 * runtimeClasspath — zwei Versuche darüber schlugen fehl. Er liegt aber
				 * verlässlich im Gradle-Modul-Cache; die Fassung wird nicht festgenagelt,
				 * sondern die neueste genommen. */
				def cache = new File(gradle.gradleUserHomeDir,
					"caches/modules-2/files-2.1/net.fabricmc/sponge-mixin")
				def gefunden = []

				if (cache.exists())
				{
					cache.eachFileRecurse { datei ->
						if (datei.name.startsWith("sponge-mixin-") && datei.name.endsWith(".jar"))
						{
							gefunden << datei
						}
					}
				}

				/* ⛔ "NEUESTE DATEI" IST NICHT "NEUESTE FASSUNG" (2026-08-10, eine Stunde).
				 * Hier stand nur `sort { -it.lastModified() }`. Gradle lud irgendwann
				 * sponge-mixin-0.15.5+mixin.0.8.7-SOURCES.jar nach — ein Quelltext-Archiv
				 * ohne Premain-Class. Es hiess sponge-mixin-*.jar, es war die neueste
				 * Datei, also wurde es der Agent. Ergebnis:
				 *
				 *     Error occurred during initialization of VM
				 *     agent library failed Agent_OnLoad: instrument
				 *
				 * Die JVM startete gar nicht mehr — und das Boot-Log meldete davor
				 * freundlich "[mixin-hotswap] agent: ...-sources.jar". Die AUSWAHL log,
				 * nicht der Start: sie meldete Erfolg fuer eine Datei, die die verlangte
				 * Faehigkeit nicht hat. Zwei taugliche Agent-JARs lagen daneben.
				 *
				 * Ein Namensfilter auf "-sources" waere die Symptomkur; morgen heisst es
				 * -javadoc oder -slim. Gefiltert wird deshalb auf die EIGENSCHAFT, die
				 * gebraucht wird: steht Premain-Class/Agent-Class im Manifest? */
				def istAgent = { datei ->
					try
					{
						return new java.util.zip.ZipFile(datei).withCloseable { zip ->
							def eintrag = zip.getEntry("META-INF/MANIFEST.MF")

							if (eintrag == null)
							{
								return false
							}

							def text = zip.getInputStream(eintrag).getText("UTF-8")

							return text.contains("Premain-Class:") || text.contains("Agent-Class:")
						}
					}
					catch (Exception fehler)
					{
						return false        // unlesbar/kaputt = kein Agent
					}
				}

				def tauglich = gefunden.findAll(istAgent)

				if (tauglich.isEmpty() && !gefunden.isEmpty())
				{
					throw new GradleException(
						"-PmixinHotswap: " + gefunden.size() + " sponge-mixin-*.jar gefunden, "
						+ "aber KEINES hat Premain-Class im Manifest (nur Quelltext-/Doku-Archive?): "
						+ gefunden.collect { it.name }.join(", "))
				}

				def mixinJar = tauglich.sort { -it.lastModified() }.find { true }

				if (mixinJar == null)
				{
					/* Ein Werkzeug, das nicht kann was verlangt wird, muss LAUT scheitern —
					 * ein stilles Weiterlaufen ohne Agent sähe aus wie „Mixin-Hotswap geht
					 * nicht", und genau diese Fehldiagnose hat schon Monate gekostet. */
					/* ⛔ DEN AUSWEG MITGEBEN (2026-08-23, Umzug auf Omarchy). Auf einer frischen
					 * Maschine ist der Gradle-Cache leer, das JAR landet dort erst NACH der
					 * Aufloesung — die diese Zeile in der KONFIGURATIONSPHASE verhindert.
					 * Henne-Ei: der Bau scheiterte mit "kein sponge-mixin-*.jar", was wie
					 * "Mixin-Hotswap kaputt" aussieht statt wie "Cache noch kalt". */
					throw new GradleException(
						"-PmixinHotswap: kein sponge-mixin-*.jar unter " + cache
						+ "\n  Cache noch kalt? Einmal './gradlew compileClientJava -PkeinMixinHotswap'"
						+ " laufen lassen, danach liegt das JAR da und normale Bauläufe gehen wieder.")
				}

				property "mixin.hotSwap", "true"
				vmArgs "-javaagent:${mixinJar.absolutePath}"

				println "[mixin-hotswap] agent: ${mixinJar.name}"
			}

			/*
			 * ⛔ EIGENER LAUFORDNER FUER DIE TEST-INSTANZ (2026-07-29, R3 in docs/REIBUNGEN.md).
			 *
			 * Zwei clients duerfen sich `run/` nicht teilen: Minecraft haelt eine session.lock
			 * auf der geladenen welt, und options.txt/config werden beim beenden ueberschrieben.
			 * Die zweite instanz bekommt deshalb `run_2` (steht schon in .gitignore).
			 *
			 * WOFUER ueberhaupt eine zweite: meine beweis-laeufe haben dem nutzer panel,
			 * kategorie und cursor unter den haenden weggezogen, einmal sein vorbereitetes
			 * testszenario zerschossen. Die test-instanz darf ich jederzeit ruinieren.
			 *
			 *   pwsh tools/dev-neustart.ps1 -Test -Starten
			 */
			runDir project.findProperty("laufordner") ?: "run"

			/* ⛔ A/B-VERGLEICH BRAUCHT DENSELBEN NUTZERNAMEN (2026-08-10). Der Dev-Launcher
			 * wuerfelt sonst je Start einen "PlayerNNN" — und Minecraft waehlt die Standardhaut
			 * (Steve/Alex) aus dem UUID-Hash des Namens. Gemessen: 1.21.1 zeigte Player306 mit
			 * rotbraunem Arm, 26.2 Player963 mit blassem. 45 % Bildabweichung, komplett
			 * hausgemacht. Mit -Pnutzer=AB sind beide Seiten gleich. */
			programArgs "--username", (project.findProperty("nutzer") ?: "Player")
			programArgs "--quickPlaySingleplayer", (project.findProperty("welt") ?: "New World")

			/* GL-FEHLER LAUT MACHEN:  ./gradlew runQuick -PglDebug
			 *
			 * Ohne das schweigt der Treiber: ein ungueltiger GL-Aufruf reisst die JVM
			 * kommentarlos mit einer Zugriffsverletzung (0xC0000005) ab -- kein Crashreport,
			 * keine Ausnahme, nichts im Log. Genau so stirbt der BBS-Editor beim ersten
			 * Zeichnen (Aufgabe 88).
			 *
			 * --checkGlErrors laesst Minecraft nach jedem Aufruf glGetError lesen und die
			 * Stelle melden. Kostet Bilder pro Sekunde, deshalb nicht standardmaessig an --
			 * aber beim Suchen eines nativen Absturzes ist es der Unterschied zwischen
			 * "irgendwo im Zeichnen" und einer Zeilennummer.
			 * --renderDebugLabels beschriftet zusaetzlich die GPU-Objekte, damit die Meldung
			 * sagt WELCHER Puffer/welche Textur gemeint ist. */
			if (project.hasProperty("glDebug"))
			{
				programArgs "--checkGlErrors", "--renderDebugLabels"
			}

			/* ZEICHENSPUR DER BBS-OBERFLAECHE:  ./gradlew runQuick -Pfuehler
			 *
			 * Ergaenzt --checkGlErrors um den Fall, den es NICHT faengt: einen Absturz, der
			 * kein ungueltiger GL-Aufruf ist (glGetError bleibt still, die JVM stirbt trotzdem).
			 * Der Fuehler schreibt vor JEDEM Oberflaechenelement eine ungepufferte Zeile nach
			 * System.err -- die letzte Zeile im Log benennt dann den Verursacher.
			 *
			 * Siehe mchorse.bbs_mod.ui.framework.elements.utils.Zeichenfuehler. */
			if (project.hasProperty("fuehler"))
			{
				/* ⚠️ Loom kennt kein jvmArgs -- die Startklasse heisst RunConfigSettings und
				 * bietet vmArg(s)/property. property(k, v) setzt daraus ein -Dk=v. */
				property "bbs.zeichenfuehler", "true"
			}

			/* MIXIN-AUDIT, standardmaessig AN (2026-08-03).
			 *
			 * Schreibt beim Start run_N/.mixin.out/audit/mixin_implementation_report.txt:
			 * jede Klasse, der ein Mixin ein Interface anhaengt, ohne dessen Methoden zu
			 * implementieren. Das ist ein stiller Fehler -- er faellt erst als
			 * AbstractMethodError auf, wenn die Methode zufaellig gerufen wird.
			 *
			 * Kostet nichts messbares (Start unveraendert bei 21 s). Erster Lauf: drei
			 * Befunde, alle FREMD (zweimal Fabrics PacketListenerExtensions, einmal
			 * PreparableReloadListener an LevelRenderer) -- keiner aus unserem Code. Damit
			 * ist diese Fehlerklasse fuer uns ausgeschlossen, was vorher niemand wusste.
			 *
			 * Die gewobenen Klassen zusaetzlich auf die Platte schreiben (viele Dateien,
			 * nur zur Fehlersuche):   ./gradlew runQuick -PmixinExport */
			property "mixin.checks.interfaces", "true"

			if (project.hasProperty("mixinExport"))
			{
				property "mixin.debug.export", "true"
				property "mixin.debug.verbose", "true"
			}
		}
	}
}

/* P3-26.2-AUS: integrations-code fremder mods aus dem build genommen.
 *
 * WARUM: diese 36 dateien sprechen die API von Iris, Veil, MCEF und PhysicsMod an. Deren
 * abhaengigkeiten sind weiter unten stillgelegt (dieselbe markierung), also KOENNEN sie
 * nicht uebersetzen -- sie meldeten 312 der 2292 client-fehler, also 14 %, ohne dass eine
 * einzige davon etwas mit 26.2 zu tun hat. Sie verschwinden, wenn die fremdmods
 * zurueckkommen, nicht durch portieren.
 *
 * ⛔ DER AUSSCHLUSS ALLEIN WAERE EIN STARTABBRUCH OHNE COMPILERFEHLER. Elf dieser klassen
 * standen in `bbs.client.mixins.json` und eine konfiguration in `fabric.mod.json`. Ein
 * mixin-eintrag, dessen klasse nicht im jar liegt, bricht den start ab. Darum gehoeren
 * drei stellen zusammen und wurden zusammen geaendert:
 *   1. dieser ausschluss
 *   2. bbs.client.mixins.json  -> iris- und sodium-eintraege nach "_P3-26.2-AUS" verschoben
 *   3. fabric.mod.json         -> bbstools.physicsmod.mixins.json ausgetragen
 *
 * ZURUECKHOLEN, einzeln und je mit eigenem beweis: abhaengigkeit anschalten, eintrag hier
 * streichen, mixin-namen zurueck in die konfiguration, bauen, booten, wirkung messen.
 */
def physicsModJar = file("libs/physics-mod-pro-v186-fabric-mc-26.2.jar")

sourceSets {
	client {
		java {
			/* Ohne das jar fallen genau die vier dateien heraus, die net.diebuddies
			 * importieren: die drei mixins und ihre bruecken-logik. Nur PhysikModLogik
			 * traegt die fremdtypen ausserhalb des mixin-pakets — die mixins rufen sie
			 * ueber MixinBruecke, also namentlich, und vermissen sie zur laufzeit nicht. */
			if (!physicsModJar.exists()) exclude "com/afrobama/bbstools/client/mixin/physicsmod/**"
			if (!physicsModJar.exists()) exclude "com/afrobama/blendertransform/PhysikModLogik.java"
			exclude "com/afrobama/bbstools/client/bbs/veil/**"
			exclude "com/afrobama/bbstools/client/veil/**"
			// 2026-08-10 raus: physicsmod ist wieder im build (v186, mc 26.2).
			exclude "com/afrobama/bbstools/client/web/MCEFWeb*"
			/* ⛔ BLEIBT AUS, auch mit Iris im Build (2026-08-10 gemessen). Diese drei
			 * Dateien sind UNSER code vom 27.07. fuer 1.21.1 und nie nach 26.2 portiert
			 * worden — der Ausschluss hatte das verdeckt. Sie scheitern nicht an Iris,
			 * sondern an 26.2: WorldRenderContext (Fabric-API umbenannt), RenderStateShard
			 * (entfallen), getTimer() -> getDeltaTracker(), getPosition() -> position().
			 * Das ist Portierarbeit, kein Update. */
			exclude "com/afrobama/bbstools/client/crowd/mass/CrowdIris*"
			exclude "com/afrobama/bbstools/client/crowd/mass/CrowdMassVeil*"
			/* ⛔ HIER STAND EIN AUSSCHLUSS DES GANZEN fracture-PAKETS -- ER WAR FALSCH.
			 * Grundlage war eine suche nach dem WORT "PhysicsMod", und das steht dort in
			 * kommentaren und klassennamen. Die IMPORTE sagen etwas anderes: keine einzige
			 * der 26 fracture-dateien importiert net.diebuddies (PhysicsMod), com.sk89q
			 * (WorldEdit), foundry.veil oder net.irisshaders. BonePhysicsSimulator ist
			 * BBS-eigene knochenphysik, kein PhysicsMod-anhang.
			 *
			 * Ausgeschlossen bleiben nur die drei MIXINS, die wirklich in PhysicsMod-klassen
			 * injizieren (com/afrobama/bbstools/client/mixin/physicsmod/**, weiter oben).
			 * Das feature selbst wird portiert, nicht stillgelegt.
			 *
			 * Geprueft mit: python tools/fremdmod-schluss.py */
			// 2026-08-10 raus: sodium ist wieder im build (0.9.2-alpha.4, mc 26.2).
			/* NICHT das ganze paket: ShaderCurves und QueueMap darin sind das DATENMODELL
			 * des shader-kurven-clips, an dem UICurveClip, CurveClientClip und BBSRendering
			 * haengen -- BBS-code, kein Iris-anhang. Nur die drei klassen, die wirklich
			 * gegen Iris uebersetzen, fliegen raus. */
			exclude "mchorse/bbs_mod/utils/sodium/**"
			exclude "mchorse/bbs_mod/forms/renderers/utils/RecolorVertexSodiumConsumer.java"
			/* Zweite welle, gleiche ursache: fremd-mods ohne 26.2-bau. */
			/* NUR die drei, die gegen Veil uebersetzen. BBSFxState und BBSFxCommand sind
			 * eigener zustand bzw. eigener befehl -- 79 stellen im baum haengen an
			 * BBSFxState, ein pauschales BBSFx* riss sie alle mit. */
			exclude "com/afrobama/bbstools/client/fx/BBSFxPipelineRegistrar.java"
			exclude "com/afrobama/bbstools/client/fx/BBSFxShadowmapPrePass.java"
			exclude "com/afrobama/bbstools/client/fx/BBSFxUniformPusher.java"
			exclude "com/afrobama/bbstools/client/crowd/mass/BBSCrowdAcceleratedRenderer.java"
			exclude "com/afrobama/bbstools/client/mixin/accelrender/**"
			exclude "com/afrobama/bbstools/client/web/BBSWebBridge.java"
			/* Dritte welle: die BEFEHLE und registraturen, die die oben ausgeschlossenen
			 * renderer bedienen. Sie sind der bedienteil derselben features -- ohne den
			 * renderer haben sie nichts zu schalten.
			 *
			 * ⛔ WELCHE FEATURES DAMIT AUS SIND, damit es niemand spaeter suchen muss:
			 *   /accelrender + /crowdgpu + /crowdmass  -> massen-crowd auf GPU (AcceleratedRendering, Iris)
			 *   /bbsfx + demo-sequenzer                 -> Veil-nachbearbeitung (bloom, supernova, grain)
			 *   fracture komplett                       -> PhysicsMod-zerbrechen, gravitationsgewehr
			 *   MCEF-webseite im spiel                  -> MCEF
			 * Alle vier kommen mit ihrer abhaengigkeit zurueck, nicht durch portieren. */
			exclude "com/afrobama/bbstools/client/cinematic/AccelRenderCommand.java"
			exclude "com/afrobama/bbstools/client/cinematic/CrowdGpuCommand.java"
			exclude "com/afrobama/bbstools/client/fx/BBSFxCommand.java"
			exclude "com/afrobama/bbstools/client/fx/effects/DemoSequencer.java"
			exclude "com/afrobama/bbstools/client/crowd/mass/CrowdMassCommand.java"
			exclude "com/afrobama/bbstools/client/crowd/mass/CrowdInstancedRenderer.java"
			exclude "com/afrobama/bbstools/client/crowd/mass/CrowdMassSolidToggleCommand.java"
			/* 2026-07-31: LegacyRendererDebuggers ist WIEDER DRIN. Ausgeschlossen war die ganze
			 * Klasse, weil ZWEI ihrer Huellen gegen Iris bzw. AcceleratedRendering uebersetzen --
			 * das kostete achtunddreissig funktionierende Debugger mit, darunter eval (unser
			 * Messkanal) und live-log. Die zwei Huellen stehen jetzt allein in LegacyCrowdDebuggers,
			 * und nur die bleibt draussen. */
			exclude "com/afrobama/bbstools/client/debug/LegacyCrowdDebuggers.java"
			/* Nachlauf: reine Debug-Tracer FUER die oben ausgeschlossenen Klassen.
			 * Sie tauchten erst im zweiten Bau auf -- ein Ausschluss erzeugt eine kleine
			 * Welle, weil andere Dateien die entfernten Pakete importieren. */
			exclude "com/afrobama/bbstools/client/mixin/debug/MixinMethodTracer_Veil*"
		}
	}
}
apply from: 'gradle/addon-api.gradle'

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	/* ⛔ MOJANG-MAPPINGS STATT YARN (2026-07-30, P2 des 26.2-ports).
	 *
	 * Fabric unterstuetzt Yarn ab 26.1 nicht mehr offiziell. Der umzug laeuft darum HIER
	 * auf 1.21.1, wo das spiel noch laeuft und jede messung gegenpruefbar ist — nicht
	 * gleichzeitig mit dem versionssprung.
	 *
	 * ⛔ ZWEI HAELFTEN, UND EINE ALLEIN BRINGT NUR FEHLER: `migrateMappings` schreibt den
	 * QUELLTEXT um, diese zeile den CLASSPATH. Nach dem quelltext-umzug allein meldete
	 * javac 100x "Package net.minecraft.core ist nicht vorhanden" — die quellen sprachen
	 * schon Mojang, die gemappte MC-abhaengigkeit noch Yarn.
	 *
	 * `yarn_mappings` in gradle.properties ist damit unbenutzt, bleibt aber vorerst
	 * stehen: der zweig 1.21.1 baut weiter darueber. */
	/* ⛔ AB 26.1 GIBT ES KEINE MAPPINGS-ZEILE MEHR — Minecraft ist nicht mehr obfuskiert.
	 *
	 * Gemessen 2026-07-30: im version-manifest fehlen `client_mappings`/`server_mappings`
	 * ab 26.1 (1.21.11 hat sie noch, 26.1/26.1.2/26.2/26.3-snapshot nicht), und im jar steht
	 * `net/minecraft/client/renderer/entity/PandaRenderer.class` statt `class_310`. Es gibt
	 * schlicht nichts zu mappen.
	 *
	 * `loom.officialMojangMappings()` versucht trotzdem etwas zu holen und bricht ab mit
	 * "Failed to find official mojang mappings for 26.2". Das Fabric-Beispielprojekt auf dem
	 * 26.2-zweig hat an dieser stelle GAR KEINE zeile.
	 *
	 * Fuer den zweig 1.21.1 gilt das NICHT — dort ist die zeile noetig und steht auch da. */
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	/* P1/P2 (2026-08-17, spike -> vollausbau): NanoVG — antialiasierte 2D-vektorgrafik
	 * AUF MCs GL-kontext, aus DERSELBEN LWJGL-familie/-version wie MC (3.3.3, gemessen
	 * im classpath). Natives fuer alle plattformen, die MC selbst bedient. */
	/* ⛔ include() IST PFLICHT, nicht Kosmetik. runtimeOnly und implementation legen
	 * das modul nur in den DEV-classpath, den Gradle stellt — ins ausgelieferte jar
	 * kommt es damit nicht. Beim endnutzer fehlt dann org.lwjgl.nanovg und der mod
	 * stirbt im ladevorgang, weil der client-start NanoProbe.register() ruft.
	 * Gemeldet 2026-08-24: "die kommen nicht rein". Minecraft bringt LWJGL 3.3.3
	 * mit, aber NICHT das nanovg-modul. Gegenprobe am gebauten jar:
	 * `unzip -l build/libs/*.jar | grep nanovg` muss 7 treffer zeigen, nicht 0.
	 * Dieselbe regel wie weiter unten bei jflac/jlayer. */
	implementation include("org.lwjgl:lwjgl-nanovg:3.4.3")
	include "org.lwjgl:lwjgl-nanovg:3.4.3:natives-linux"
	include "org.lwjgl:lwjgl-nanovg:3.4.3:natives-linux-arm64"
	include "org.lwjgl:lwjgl-nanovg:3.4.3:natives-windows"
	include "org.lwjgl:lwjgl-nanovg:3.4.3:natives-windows-arm64"
	include "org.lwjgl:lwjgl-nanovg:3.4.3:natives-macos"
	include "org.lwjgl:lwjgl-nanovg:3.4.3:natives-macos-arm64"
	runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.3:natives-linux"
	runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.3:natives-linux-arm64"
	runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.3:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.3:natives-windows-arm64"
	runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.3:natives-macos"
	runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.3:natives-macos-arm64"
	
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// implementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
	/* MERGE 2026-07-27: aus dem CML-upstream — video-wiedergabe (VideoClip, VideoRenderer,
	 * VideoWaveformCache). Ohne die lib faellt der komplette video-clip-block weg. */
	// P3-26.2-AUS: implementation "maven.modrinth:watermedia:2.1.37"
	/* 2026-08-10 WIEDER AN: 0.9.2-alpha.4 fuer mc 26.2 (Modrinth, 07.08.).
	 * ⚠️ ALPHA-KANAL — es gibt fuer 26.2 nichts Stabileres. */
	/* ⛔ 0.9.1 (RELEASE), NICHT 0.9.2-alpha.4 — sonst startet Fabric gar nicht erst.
	 * Gemessen 2026-08-10: Sodium 0.9.2-alpha.4 traegt `breaks iris @ [<=1.11.2]`, und
	 * 1.11.2 ist die NEUESTE Iris fuer 26.2 (Modrinth: 1.11.0/1.11.1/1.11.2, mehr gibt es
	 * nicht). Der Bruch kommt also von Sodiums Seite; Iris selbst verlangt nur `sodium 0.9.x`.
	 * 0.9.1 ist ein Release vom selben Tag wie Iris 1.11.2 — das zusammengehoerige Paar.
	 *
	 * Wer Sodium wieder hochzieht, verliert Iris. Fabric sagt das beim Start deutlich
	 * ("Incompatible mods found"), es ist also kein stiller Ausfall. */
	implementation "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
	/* P3-26.2-AUS: 2026-08-10 versucht, 1.11.2 fuer mc 26.2 anzuschalten -> ROT.
	 * Nicht die Fassung ist schuld, das ist Portierarbeit statt Update.
	 *
	 * NACHGEMESSEN am selben Tag (abhaengigkeit an, die vier iris-ausschluesse raus,
	 * compileClientJava): es sind GENAU 4 FEHLER IN 2 DATEIEN, nicht drei Klassen.
	 * IrisUtils und IrisTextureWrapperLoader uebersetzen inzwischen sauber, und 6 der
	 * 7 mixins unter mixin/client/iris ebenfalls. Offen sind nur:
	 *
	 *   1. ShaderCurves.addUniforms(List) fehlt -> CustomUniformsBuilderMixin:18.
	 *      Kein Drift: die methode wurde in 10bfb41cd bei GENAU DIESER stilllegung
	 *      entfernt, weil sie Iris-typen fuehrt. Zurueckholen = jenen hunk zurueck.
	 *
	 *   2. IrisTextureWrapper haengt an AbstractTexture.getId() und
	 *      load(ResourceManager). BEIDE GIBT ES IN 26.2 NICHT MEHR — gemessen in der
	 *      laufenden JVM, AbstractTexture hat nur noch:
	 *          GpuTexture getTexture() · GpuSampler getSampler()
	 *          GpuTextureView getTextureView() · void releaseTextures()
	 *      Die klasse reicht Iris eine GL-textur-NUMMER durch. Das ist damit kein
	 *      umbenennen, sondern ein umbau der uebergabe auf GpuTexture — und er muss
	 *      zu dem passen, was Iris 1.11.2 auf SEINER seite erwartet.
	 *
	 * Punkt 2 ist die eigentliche Arbeit. Wer sie anfaengt: erst nachsehen, was Iris
	 * 1.11.2 fuer 26.2 als textur-uebergabe verlangt, dann bauen — nicht umgekehrt. */
	add(bbsGraphics == "vulkan" ? "compileOnly" : "implementation", "maven.modrinth:iris:1.11.6+26.3-fabric")
	// Vitrail 26.3 release, exact Modrinth version ID; SHA256 matches the frozen GitHub release.
	compileOnly "maven.modrinth:oSIKhgz3:Ul13RHiD"
	// Rinku (Chromium im Spiel) fuer das Texture Studio: nur zum Kompilieren, der Nutzer installiert es selbst.
	compileOnly "maven.modrinth:rinku:3.0.5-26.3-fabric"

	/* ⭐ spark — ETABLIERTER PROFILER STATT EIGENER ZAEHLER (2026-08-03).
	 *
	 * Warum fremd statt selbst: an einem Tag haben fuenf eigene Messwerkzeuge falsche
	 * Auskunft gegeben (Details: docs/WERKZEUG-ERSATZ.md). spark ist der Industriestandard
	 * im Minecraft-Umfeld -- PaperMC empfiehlt es, Mojang zitiert es in Bugreports,
	 * 200 Mio+ Downloads. Es misst ohne Safepoint-Verzerrung, zeigt Aufrufbaeume als
	 * Flamegraph und analysiert die Heap-Verteilung im laufenden Spiel.
	 *
	 * modRuntimeOnly, NICHT implementation: es ist ein Werkzeug fuer die
	 * Entwicklungsumgebung und darf weder gebuendelt noch zur Laufzeit verlangt werden.
	 *
	 * Bedienung im Spiel:  /spark profiler start  ...  /spark profiler stop
	 * 1.10.173 ist die erste Fassung mit Minecraft 26.2 (ueber die Modrinth-API geprueft,
	 * nicht geraten). */
	/* spark liegt NICHT als Gradle-Abhaengigkeit vor: dieses Loom-Setup stellt keine
	 * mod*-Dependency-Konfigurationen bereit (geprueft: nur modCompileClasspath
	 * existiert). Das Jar liegt stattdessen in run_N/mods/ -- Fabric Loader nimmt es
	 * von dort. Siehe docs/WERKZEUG-ERSATZ.md. */

	/* AUTONOMIE 2026-07-27: fremd-mods gegen die com/afrobama kompiliert.
	 * Alle compileOnly — sie werden NICHT gebuendelt und NICHT zur laufzeit verlangt;
	 * die betroffenen features (Veil-FX, PhysicsMod-fracture, accelerated crowd-rendering,
	 * MCEF-webbridge) pruefen selbst per FabricLoader.isModLoaded() und schalten sich ab.
