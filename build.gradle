	/* ⛔ VEIL HAT KEINEN 26.2-BAU — und das ist kein Warten, sondern ein Zustand.
	 * Modrinth am 2026-08-10 abgefragt: neueste Fabric-Fassung ist 4.4.1 vom 2026-07-31,
	 * und ALLE Fassungen listen nur 1.21.1. Das Jar in libs/ ist folgerichtig
	 * veil-fabric-1.21.1-4.0.1.jar.
	 *
	 * Folge fuer die zwei MixinMethodTracer_Veil*: die stehen in KEINER mixins.json --
	 * nicht einmal geparkt -- und koennen also gar nicht weben. Sie auf die Bruecke zu
	 * heben waere Arbeit an totem Quelltext; ohne Wirtsmod gibt es nichts zu tauschen und
	 * nichts zu messen. Sie bleiben als einzige Mixins im Baum ohne Bruecke. */
	// P3-26.2-AUS: compileOnly fileTree(dir: "libs", include: ["veil-fabric*.jar"])
	// P3-26.2-AUS: compileOnly fileTree(dir: "libs", include: ["acceleratedrendering*.jar"])
	/* 2026-08-10 WIEDER AN: v186 fuer mc 26.2, geholt mit tools/patreon-holen.mjs.
	 * compileOnly — nur die drei Mixins unter mixin/physicsmod/ brauchen die Typen.
	 * Die uebrigen acht Dateien, die PhysicsMod ansprechen, arbeiten per Reflection
	 * (FracturePhysicsBridge allein 17x) und kompilieren auch ohne. */
	/* ⛔ NUR WENN DAS JAR DALIEGT. Physics Mod Pro ist "all rights reserved" und darf dem
	 * repository nicht beiliegen (siehe LICENSE.md) — ein fremder klon hat es also nicht.
	 * Ohne die bedingung scheiterte `gradlew build` dort an net.diebuddies.physics, und das
	 * waere die erste erfahrung eines jeden, der den fork bauen will. Mit dem jar in libs/
	 * baut alles wie zuvor; ohne es fallen die drei mixins unter mixin/physicsmod/ heraus
	 * (dieselbe mechanik wie bei veil/accelrender weiter oben). Die uebrigen acht dateien,
	 * die PhysicsMod ansprechen, arbeiten per reflection und kompilieren ohne das jar. */
	if (physicsModJar.exists()) compileOnly files(physicsModJar)
	// P3-26.2-AUS: compileOnly files("libs/worldedit-mod-7.3.8.jar")
	// P3-26.2-AUS: compileOnly "com.cinemamod:mcef:2.1.6-1.21.1"

	/* AUTONOMIE 2026-07-27: audio-decoder fuer com/afrobama/bbstools/audio
