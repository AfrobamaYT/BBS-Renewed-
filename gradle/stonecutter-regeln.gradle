/* Ersetzungsregeln fuer alle Versionsknoten — eingebunden von stonecutter.gradle (Mod) und
 * dev/stonecutter.gradle (Companion), damit beide Baeume dieselbe Uebersetzung bekommen. */

/* JSON durchlaeuft die Ersetzungen auch (fabric.mod.json, siehe "eingespritzt" unten);
 * Kommentar-Bloecke gibt es in JSON nicht, nur die Ersetzungen greifen. */
stonecutter.handlers {
	inherit("java", "json", "vsh", "fsh", "glsl")
}

/* 26.3 hat GLFW durch SDL3 ersetzt: Tasten sind dort SDL-Scancodes, davor GLFW-Keycodes.
 * Der eingecheckte Code schreibt SDLScancode.SDL_SCANCODE_*; vor 26.3 wird daraus beim
 * Umschalten GLFW.GLFW_KEY_* — gleiche Taste, Wert der jeweiligen Version.
 * Die Tabelle ist nicht geraten: sie folgt den Werten von Mojangs InputConstants.KEY_* in
 * 26.3 (= SDL) und 26.2 (= GLFW); nur die sieben Tasten, die InputConstants nicht fuehrt,
