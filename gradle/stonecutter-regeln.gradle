/* SDL-Systemzeiger zu GLFW-Standardzeigern, so wie der 26.2-Stand sie benutzt hat. */
def sdlZeigerZuGlfw = [
	'DEFAULT': 'ARROW', 'POINTER': 'HAND', 'TEXT': 'IBEAM', 'CROSSHAIR': 'CROSSHAIR',
	'EW_RESIZE': 'HRESIZE', 'NS_RESIZE': 'VRESIZE', 'MOVE': 'RESIZE_ALL'
]

/* Rueckmuster der Regeln vor 26.1: Stonecutter wendet fuer Knoten, auf die eine Regel NICHT
 * zutrifft, ihre Rueckrichtung an (gemessen 2026-10-12: ".gui" -> ".gui.hud" verdarb 26.2).
 * Der Quelltext steht immer im 26.3-Stand, also darf die Rueckrichtung nie treffen. */
apply from: rootProject.file("gradle/compat-stufen.gradle")
def NIE = "(?!)"

stonecutter.parameters {
	def vorSdl = eval(current.version, "<26.3")
	/* Bis 1.21.11: obfuskiertes Minecraft (Mojang-Mappings) und die aeltere Fabric-API. */
	def vor261 = eval(current.version, "<26.1")

	replacements {
		/* Jede SDL-Klasse, die vor 26.3 in GLFW aufgeht, bekommt beim Import eine Marke, damit
		 * der Rueckweg eindeutig bleibt; doppelte GLFW-Importe sind in Java erlaubt. */
		["SDLScancode", "SDLMouse"].each { klasse ->
			regex(vorSdl) {
				replace("\\bimport org\\.lwjgl\\.sdl\\." + klasse + ";", "import org.lwjgl.glfw.GLFW; /* " + klasse + " */",
					"\\bimport org\\.lwjgl\\.glfw\\.GLFW; /\\* " + klasse + " \\*/", "import org.lwjgl.sdl." + klasse + ";")
			}
		}

		sdlZeigerZuGlfw.each { sdl, glfw ->
			regex(vorSdl) {
				replace("\\bSDLMouse\\.SDL_SYSTEM_CURSOR_" + sdl + "\\b", "GLFW.GLFW_" + glfw + "_CURSOR",
					"\\bGLFW\\.GLFW_" + glfw + "_CURSOR\\b", "SDLMouse.SDL_SYSTEM_CURSOR_" + sdl)
			}
		}

		/* Adressen im Browser oeffnen: Blaze3D.openUri gibt es erst ab 26.3 (SDL), davor Util.getPlatform(). */
		regex(vorSdl) {
			replace("\\bBlaze3D\\.openUri\\(", (eval(current.version, "<1.21.11") ? "net.minecraft.Util" : "net.minecraft.util.Util") + ".getPlatform().openUri(", NIE, "Blaze3D.openUri(")
		}

		/* 26.3 fragt die Taste ohne Fenster ab (SDL kennt nur eines), davor mit. */
		regex(vorSdl) {
			replace("\\bInputConstants\\.isKeyDown\\(", "InputConstants.isKeyDown(net.minecraft.client.Minecraft.getInstance().getWindow()" + (eval(current.version, "<1.21.9") ? ".getWindow(), " : ", "),
				"\\bInputConstants\\.isKeyDown\\(net\\.minecraft\\.client\\.Minecraft\\.getInstance\\(\\)\\.getWindow\\(\\)(?:\\.getWindow\\(\\))?, ", "InputConstants.isKeyDown(")
		}

		/* Nachruestung (src/compat): Loom liest injizierte Interfaces nur aus der fabric.mod.json
		 * des Hauptquellsatzes, darum kommen sie vor 26.3 dort hinein. */
		def eingespritzt = '"custom": {"loom:injected_interfaces": ' +
			groovy.json.JsonOutput.toJson(compatInjiziert(compatStufen(vor261, eval(current.version, "<1.21.5"), eval(current.version, "<1.21.2"), eval(current.version, "<1.20.5"), eval(current.version, "<1.20.2"))))
				/* Innere Klassen (RenderPipeline$Builder): "$" darf weder in eine Stonecutter-Ersetzung
				 * noch durch processResources' Template-Expansion; JSON liest \u0024 als "$". */
				.replace('$', '\\u0024') +
			'},\n  "accessWidener": "bbs.accesswidener",'
		/* Der Companion (dev) kompiliert gegen dieselben eingespritzten Interfaces; die Klassen liegen
		 * im Mod-Jar auf seinem Klassenpfad, zur Laufzeit wirken die Mixins des Mods. */
		def eingespritztDev = '"id": "bbsdev",\n  "custom": {"loom:injected_interfaces": ' +
			groovy.json.JsonOutput.toJson(compatInjiziert(compatStufen(true, eval(current.version, "<1.21.5"), eval(current.version, "<1.21.2"), eval(current.version, "<1.20.5"), eval(current.version, "<1.20.2"))))
				.replace('$', '\\u0024') + '},'
		regex(vor261) {
			replace(java.util.regex.Pattern.quote('"id": "bbsdev",'), eingespritztDev, NIE, '"id": "bbsdev",')
		}
		regex(vorSdl) {
			replace(java.util.regex.Pattern.quote('"accessWidener": "bbs.accesswidener",'), eingespritzt,
				java.util.regex.Pattern.quote(eingespritzt), '"accessWidener": "bbs.accesswidener",')
		}

		/* KeyEvent: das zweite Feld heisst in 26.3 keycode(), davor scancode(). */
		regex(vorSdl) {
			replace("\\.keycode\\(\\)", ".scancode()", "\\.scancode\\(\\)", ".keycode()")
		}

		/* 26.3 hat zwischen API und Backend eine Frontend-Schicht eingezogen; vor 26.3 IST
		 * CommandEncoder bzw. RenderPass diese Schicht (backend()/isInRenderPass() gibt
		 * src/compat/compat.accesswidener frei, siehe build.gradle). Rueckweg mehrdeutig — vcsVersion bleibt darum 26.3. */
		["FrontendCommandEncoder": "com.mojang.blaze3d.systems.CommandEncoder",
		 "FrontendRenderPass": "com.mojang.blaze3d.systems.RenderPass"].each { neu, alt ->
			regex(vorSdl) {
				replace("\\bcom\\.mojang\\.renderpearl\\.frontend\\." + neu + "\\b", alt,
					"\\b" + java.util.regex.Pattern.quote(alt) + "\\b(?=\\s*/\\*frontend\\*/)", "com.mojang.renderpearl.frontend." + neu)
			}
			regex(vorSdl) {
				replace("\\b" + neu + "\\b", alt.tokenize(".").last(),
					"\\b" + alt.tokenize(".").last() + "(?=\\s*/\\*frontend\\*/)", neu)
			}
		}

		/* Texturen sind in 26.3 Uniforms vom Typ COMBINED_IMAGE_SAMPLER, davor Sampler. */
		regex(vorSdl) {
			replace("\\.withUniform\\((\"[^\"]*\"), UniformType\\.COMBINED_IMAGE_SAMPLER\\)", ".withSampler(\$1)",
				"\\.withSampler\\((\"[^\"]*\")\\)", ".withUniform(\$1, UniformType.COMBINED_IMAGE_SAMPLER)")
		}

		/* Statische 26.3-Aufrufe, die es davor nicht gibt, laufen ueber src/compat. */
		regex(vorSdl) {
			replace("\\bRenderSystem\\.getCompiledPipeline\\(", "mchorse.bbs_mod.compat.Pipelines.compiled(",
				"\\bmchorse\\.bbs_mod\\.compat\\.Pipelines\\.compiled\\(", "RenderSystem.getCompiledPipeline(")
		}

		/* Listen statt Arrays (src/compat/RenderPipelineLists) und der Descriptor als eigener
		 * Builder (src/compat/RenderPassDescriptorBuilder). */
		["getColorTargetStates": "bbsColorTargetStates", "getVertexFormatBindings": "bbsVertexFormatBindings"].each { neu, alt ->
			regex(vorSdl) {
				replace("\\." + neu + "\\(\\)", "." + alt + "()", "\\." + alt + "\\(\\)", "." + neu + "()")
			}
		}
		regex(vorSdl) {
			replace("\\bRenderPassDescriptor\\.builder\\(", "RenderPassDescriptor.create(", "\\bRenderPassDescriptor\\.create\\(", "RenderPassDescriptor.builder(")
		}
		regex(vorSdl) {
			replace("\\bRenderPassDescriptor\\.Builder\\b", "RenderPassDescriptor/*Builder*/", "\\bRenderPassDescriptor/\\*Builder\\*/", "RenderPassDescriptor.Builder")
		}

		/* TextureTarget: 26.3 nimmt das Tiefenformat, davor einen Schalter fuer Tiefe. */
		regex(vor261) {
			replace("(?:\\bcom\\.mojang\\.renderpearl\\.api\\.)?GpuFormat\\.RGBA8_UNORM, (?:com\\.mojang\\.renderpearl\\.api\\.)?GpuFormat\\.D32_FLOAT\\)",
				"true)", NIE, "com.mojang.renderpearl.api.GpuFormat.RGBA8_UNORM, com.mojang.renderpearl.api.GpuFormat.D32_FLOAT)")
		}
		regex(vorSdl && !vor261) {
			replace("(?:\\bcom\\.mojang\\.renderpearl\\.api\\.)?GpuFormat\\.RGBA8_UNORM, (?:com\\.mojang\\.renderpearl\\.api\\.)?GpuFormat\\.D32_FLOAT\\)",
				"true, com.mojang.blaze3d.GpuFormat.RGBA8_UNORM)", NIE, "com.mojang.renderpearl.api.GpuFormat.RGBA8_UNORM, com.mojang.renderpearl.api.GpuFormat.D32_FLOAT)")
		}
		regex(vorSdl) {
			replace("\\.hasDepth\\(\\)", ".useDepth", "\\.useDepth\\b", ".hasDepth()")
		}

		/* Kopien einer RenderPipeline: 26.3 reicht die Shader als Satz und Push-Constants
		 * weiter, davor Vertex- und Fragment-Shader einzeln und keine Push-Constants.
		 * Rueckweg ungenau (Zeilenumbrueche) — vcsVersion bleibt 26.3. */
		regex(vorSdl) {
			replace("\\b(\\w+)\\.getShaders\\(\\)", "\$1.getVertexShader(), \$1.getFragmentShader()",
				"\\b(\\w+)\\.getVertexShader\\(\\), \\1\\.getFragmentShader\\(\\)", "\$1.getShaders()")
		}
		regex(vorSdl) {
			replace("\\b\\w+\\.pushConstantSize\\(\\),\\s*(\\w+)\\.getSortKey\\(\\)", "\$1.getSortKey()",
				"\\b(\\w+)\\.getPrimitiveTopology\\(\\), (\\w+)\\.getSortKey\\(\\)", "\$1.getPrimitiveTopology(), \$1.pushConstantSize(), \$2.getSortKey()")
		}
		regex(vorSdl) {
			replace("\\bRenderSystem\\.isWireframeAvailable\\(", "mchorse.bbs_mod.compat.Pipelines.isWireframeAvailable(",
				"\\bmchorse\\.bbs_mod\\.compat\\.Pipelines\\.isWireframeAvailable\\(", "RenderSystem.isWireframeAvailable(")
		}

		/* GLSL: 26.3 kompiliert Shader fuer Vulkan (#include, separate_shader_objects, feste
		 * Positionen). 26.2 nimmt #moj_import und bindet Attribute/Varyings ueber den NAMEN —
		 * feste Positionen wuerden die Bindung still ueberschreiben; die Nummer bleibt als
		 * Kommentar stehen, damit der Rueckweg exakt ist. */
		regex(vorSdl) {
			replace("(?m)^#include <", "#moj_import <", "(?m)^#moj_import <", "#include <")
		}
		regex(vorSdl) {
			replace("#extension GL_ARB_separate_shader_objects : require", "/* separate_shader_objects: erst ab 26.3 */",
				java.util.regex.Pattern.quote("/* separate_shader_objects: erst ab 26.3 */"), "#extension GL_ARB_separate_shader_objects : require")
		}
		regex(vorSdl) {
			replace("layout\\(location = (\\d+)\\) (in|out|flat)\\b", "/*location \$1*/ \$2",
				"/\\*location (\\d+)\\*/ (in|out|flat)\\b", "layout(location = \$1) \$2")
		}

		/* Fabric-API vor 26.1: die Payload-Register hiessen anders (Methoden, nicht in der
		 * Fabric-Migrationskarte; Namen aus BBS-FS 1.21.11 nachgeprueft). */
		regex(vor261) {
			replace("\\bPayloadTypeRegistry\\.serverboundPlay\\(\\)", "PayloadTypeRegistry.playC2S()",
				NIE, "PayloadTypeRegistry.serverboundPlay()")
		}
		regex(vor261) {
			replace("\\bPayloadTypeRegistry\\.clientboundPlay\\(\\)", "PayloadTypeRegistry.playS2C()",
				NIE, "PayloadTypeRegistry.clientboundPlay()")
		}
		/* Die Entity-Konstanten liegen vor 26.1 in EntityType selbst (es gibt kein EntityTypes). */
		regex(vor261) {
			replace("\\bimport net\\.minecraft\\.world\\.entity\\.EntityTypes;", "import net.minecraft.world.entity.EntityType; /* EntityTypes */",
				NIE, "import net.minecraft.world.entity.EntityTypes;")
		}
		regex(vor261) {
			replace("\\bEntityTypes\\.", "EntityType/*s*/.", NIE, "EntityTypes.")
		}

		regex(vorSdl) {
			replace("\\bInputConstants\\.Type\\.KEYBOARD\\b", "InputConstants.Type.KEYSYM",
				"\\bInputConstants\\.Type\\.KEYSYM\\b", "InputConstants.Type.KEYBOARD")
		}

		/* Stonecutter wendet ueberlappende Regeln nicht nacheinander an: hat die renderpearl-Regel
		 * eine Stelle ersetzt, greift keine spaetere 1.21.11-Regel mehr dort. Vor 26.1 fuehren die
		 * renderpearl-Namen darum direkt zum Endziel (verschobene Klasse oder eigene Schicht). */
		def vor261Ziel = [:] + mojangVerschobenVor261 + ersatzVor261
		/* PrimitiveTopology/IndexType sind vor 26.2 innere Klassen von VertexFormat: im Import
		 * wird daraus VertexFormat, im Code der volle innere Name. */
		def vor261Inner = ['com.mojang.blaze3d.PrimitiveTopology': 'Mode', 'com.mojang.blaze3d.IndexType': 'IndexType']
		/* RenderPass.RenderArea voll qualifiziert: vor 26.1 ist RenderArea ein eigener Typ der Schicht. */
		regex(vor261) {
			replace("\\bcom\\.mojang\\.renderpearl\\.api\\.commands\\.RenderPass\\.RenderArea\\b", "mchorse.bbs_mod.compat.alt.RenderArea", NIE, "com.mojang.renderpearl.api.commands.RenderPass.RenderArea")
		}
		renderpearlZuBlaze3d.each { neu, alt ->
			def direkt = vor261Ziel[alt]
			def inner = vor261Inner[alt]
			/* Rueckmuster NIE: fuer Knoten vor 26.1 trifft die Bedingung nicht zu, dort liefe sonst die
			 * Rueckrichtung und machte aus blaze3d-Namen in Versionsbloecken wieder renderpearl. */
			regex(vorSdl && !vor261) {
				replace("\\b" + neu.replace(".", "\\.") + "\\b", alt, NIE, neu)
			}
			if (direkt == null && inner == null) {
				/* Vor 26.1 dieselbe Umbenennung, aber RenderPass.RenderArea gehoert der Schicht. */
				regex(vor261) {
					replace("\\b" + neu.replace(".", "\\.") + "\\b(?!\\.RenderArea\\b)", alt, NIE, neu)
				}
			}
			if (inner != null) {
				regex(vor261) {
					replace("\\bimport " + neu.replace(".", "\\.") + ";", "import com.mojang.blaze3d.vertex.VertexFormat;", NIE, "import " + neu + ";")
				}
				regex(vor261) {
					replace("(?<!import )\\b" + neu.replace(".", "\\.") + "\\b", "com.mojang.blaze3d.vertex.VertexFormat." + inner, NIE, neu)
				}
			}
			if (direkt != null) {
				regex(vor261) {
					replace("\\b" + neu.replace(".", "\\.") + "\\b", direkt,
						NIE, neu)
				}
			}
		}

		/* Dieselben Klassen in Schraegstrich-Form: Mixin-Deskriptoren in Strings. Keine Wortgrenze
		 * vor dem L — in "ILcom/mojang/..." steht ein Typbuchstabe direkt davor. */
		renderpearlZuBlaze3d.each { neu, alt ->
			def n = neu.replace(".", "/")
			def a = alt.replace(".", "/")
			regex(vorSdl) {
				replace("L" + n + '(?=[;\\$])', "L" + a, "L" + a + '(?=[;\\$])', "L" + n)
			}
		}

		sdlZuGlfw.each { sdl, glfw ->
			regex(vorSdl) {
				replace("\\bSDLScancode\\.SDL_SCANCODE_" + sdl + "\\b", "GLFW.GLFW_KEY_" + glfw,
					"\\bGLFW\\.GLFW_KEY_" + glfw + "\\b", "SDLScancode.SDL_SCANCODE_" + sdl)
			}
		}
		/* 1.21.11: Fabric-API-Klassen (voll und einfach) und verschobene Mojang-Klassen. Laengste
		 * Schluessel zuerst, damit innere Klassen (Events.ModifyOutput) vor der aeusseren greifen. */
		/* Dieselben verschobenen Mojang-Klassen in Schraegstrich-Form (Mixin-Ziele in Strings). */
		mojangVerschobenVor261.each { neu, alt ->
			def n = neu.replace(".", "/")
			def a = alt.replace(".", "/")
			regex(vor261) {
				replace("L" + n + '(?=[;\\$])', "L" + a, NIE, "L" + n)
			}
		}
		[fabricApiVor261, mojangVerschobenVor261, fabricApiNamenVor261].each { tabelle ->
			tabelle.sort { -it.key.length() }.each { neu, alt ->
				regex(vor261) {
					replace("\\b" + java.util.regex.Pattern.quote(neu) + "\\b(?!\\.Baked\\b)", eval(current.version, "<1.21.9") ? alt.replace(".rendering.v1.world.", ".rendering.v1.").replace("WorldRenderEvents.EndMain", "WorldRenderEvents.Last") : alt,
						NIE, neu)
				}
			}
		}
		/* 1.21.11: 26.2-Grafiktypen aus src/compat/vor261 (Tabelle ersatzVor261). */
		ersatzVor261.each { neu, alt ->
			regex(vor261) {
				replace("\\b" + java.util.regex.Pattern.quote(neu) + "\\b", alt,
					NIE, neu)
			}
		}
		regex(vor261) {
			replace("(?<![.\\w])RenderPass\\.RenderArea\\b", "mchorse.bbs_mod.compat.alt.RenderArea",
				NIE, "RenderPass.RenderArea")
		}
		/* PrimitiveTopology und IndexType waren vor 26.2 VertexFormat.Mode und VertexFormat.IndexType
		 * (gleiche Konstanten, nachgeprueft an beiden Jars). */
		regex(vor261) {
			replace("\\bimport com\\.mojang\\.blaze3d\\.PrimitiveTopology;", "import com.mojang.blaze3d.vertex.VertexFormat; /* Topologie */",
				NIE, "import com.mojang.blaze3d.PrimitiveTopology;")
		}
		regex(vor261) {
			replace("\\bimport com\\.mojang\\.blaze3d\\.IndexType;", "import com.mojang.blaze3d.vertex.VertexFormat; /* Indextyp */",
				NIE, "import com.mojang.blaze3d.IndexType;")
		}
		regex(vor261) {
			replace("(?<![.\\w])(?:com\\.mojang\\.blaze3d\\.)?PrimitiveTopology\\b", "VertexFormat.Mode",
				NIE, "PrimitiveTopology")
		}
		regex(vor261) {
			replace("(?<![.\\w])(?:com\\.mojang\\.blaze3d\\.)?IndexType\\b", "VertexFormat.IndexType",
				NIE, "IndexType")
		}
		regex(vor261) {
			replace("(?:com\\.mojang\\.blaze3d\\.systems\\.)?RenderSystem\\.getModelViewMatrixCopy\\(\\)", "new org.joml.Matrix4f(RenderSystem.getModelViewMatrix())",
				NIE, "RenderSystem.getModelViewMatrixCopy()")
		}
		regex(vor261) {
			replace("\\bDefaultVertexFormat\\.ENTITY\\b", "DefaultVertexFormat.NEW_ENTITY",
				NIE, "DefaultVertexFormat.ENTITY")
		}
		/* GpuTexture.getFormat() liefert vor 26.1 Mojangs TextureFormat; das 26.2-GpuFormat
		 * kommt aus der Schicht. Nur an GpuTexture-Empfaengern (BBS' eigene Texture hat auch
		 * getFormat(), mit isColor/isDepth) — ein falscher Treffer scheitert laut beim Kompilieren. */
		regex(vor261) {
			replace("(?<=\\b(?:texture|source|image|previous|t)|texture\\(\\)|getColorTexture\\(\\)|gpu\\(\\))\\.getFormat\\(\\)(?!\\.is)", ".bbsGpuFormat()",
				NIE, ".getFormat()")
		}
		/* Mixin-Deskriptoren (Strings) erreicht die Typ-Umbenennung nicht: vor 26.1 nimmt
		 * GlDevice.createTexture Mojangs TextureFormat (auch die Schicht in src/compat/vor1215).
		 * Ohne das brach die Test-Companion beim ersten Texturanlegen ab (1.20.1, 2026-10-14). */
		regex(vor261) {
			replace("ILcom/mojang/renderpearl/api/GpuFormat;IIII\\)", "ILcom/mojang/blaze3d/textures/TextureFormat;IIII)",
				NIE, "ILcom/mojang/renderpearl/api/GpuFormat;IIII)")
		}
		/* VertexFormat.builder(stepRate) mit addAttribute(name, GpuFormat) gibt es erst ab 26.2. */
		regex(vor261) {
			replace("\\bVertexFormat\\.builder\\((?=[^)])", "mchorse.bbs_mod.compat.alt.VertexFormats.builder(",
				NIE, "VertexFormat.builder(")
		}
		/* GUI: 26.1 nannte GuiGraphics in GuiGraphicsExtractor um (Methodennamen ueber
		 * src/compat/vor261 GuiGraphicsAlt); 26.2 legte den Hud in Gui.hud ab, davor ist es Gui. */
		regex(vor261) {
			replace("\\bGuiGraphicsExtractor\\b", "GuiGraphics", NIE, "GuiGraphicsExtractor")
		}
		regex(vor261) {
			replace("\\.gui\\.hud\\b(?!\\.extractRenderState\\()", ".gui", NIE, ".gui.hud")
		}
		regex(vor261) {
			replace("\\.registerKeyMapping\\(", ".registerKeyBinding(", NIE, ".registerKeyMapping(")
		}
		regex(vor261) {
			replace("(?:net\\.minecraft\\.client\\.renderer\\.)?\\bRenderPipelines\\.ENTITY_TRANSLUCENT_CULL\\b", "mchorse.bbs_mod.compat.alt.RenderPipelinesAlt.ENTITY_TRANSLUCENT_CULL",
				NIE, "RenderPipelines.ENTITY_TRANSLUCENT_CULL")
		}
		/* Blockmodell-Teile: 26.2 BlockStateModelPart ist vor 26.1 BlockModelPart (getQuads(Direction)
		 * gleich, am Jar geprueft); MaterialInfo liefert BakedQuadAlt. */
		regex(vor261) {
			replace("(?:net\\.minecraft\\.client\\.renderer\\.block\\.dispatch\\.)?\\bBlockStateModelPart\\b", "net.minecraft.client.renderer.block.model.BlockModelPart", NIE, "BlockStateModelPart")
		}
		regex(vor261) {
			replace("(?:net\\.minecraft\\.client\\.resources\\.model\\.geometry\\.)?\\bBakedQuad\\.MaterialInfo\\b", "mchorse.bbs_mod.compat.alt.MaterialInfo", NIE, "BakedQuad.MaterialInfo")
		}
		/* Iris vor 26.1 fuehrt die Zusatzattribute als Elemente; ihre Namen im ENTITY-Format (aus
		 * dem Bytecode von IrisVertexFormats 1.10.7+1.21.11 gelesen). */
		[["ENTITY_ID_ATTRIBUTE", "iris_Entity"], ["MID_TEXTURE_ATTRIBUTE", "mc_midTexCoord"], ["TANGENT_ATTRIBUTE", "at_tangent"]].each { paar ->
			regex(vor261) {
				replace("(?:net\\.irisshaders\\.iris\\.vertices\\.)?\\bIrisVertexFormats\\." + paar[0] + "\\b", "\"" + paar[1] + "\"", NIE, "IrisVertexFormats." + paar[0])
			}
		}
		regex(vor261) {
			replace("\\bVertexFormat\\.Builder\\b", "mchorse.bbs_mod.compat.alt.VertexFormats.Builder", NIE, "VertexFormat.Builder")
		}
		/* Kameramatrizen und -winkel: 26.2 legt sie im CameraRenderState ab, davor fuellt sie
		 * src/compat/vor261 (LevelRendererAltMixin) und gibt sie ueber Methoden heraus. */
		[["projectionMatrix", "bbsProjectionMatrix()"], ["viewRotationMatrix", "bbsViewRotationMatrix()"]].each { paar ->
			regex(vor261) {
				replace("(?<=\\b(?:cameraRenderState|kamera))\\." + paar[0] + "\\b", "." + paar[1], NIE, "." + paar[0])
			}
		}
		[["xRot", "bbsXRot()"], ["yRot", "bbsYRot()"]].each { paar ->
			regex(vor261) {
				replace("(?<=\\b(?:cameraRenderState|kamera|camera|altCam))\\." + paar[0] + "\\b(?!\\s*\\()", "." + paar[1], NIE, "." + paar[0])
			}
		}
		/* Screen-Zeichnen: 26.1 nannte render/renderBackground in extractRenderState/extractBackground
		 * um (nur die GUI-Signaturen; Entity-Renderer heissen in beiden extractRenderState). */
		regex(vor261) {
			replace("\\bextractRenderState(?=\\(GuiGraphicsExtractor \\w)", "render", NIE, "extractRenderState")
		}
		regex(vor261) {
			replace("\\bextractBackground(?=\\(GuiGraphicsExtractor \\w)", "renderBackground", NIE, "extractBackground")
		}
		regex(vor261) {
			replace("\\bsuper\\.extractRenderState(?=\\(\\w+, mouseX, mouseY, delta\\))", "super.render", NIE, "super.extractRenderState")
		}
		regex(vor261) {
			replace("\\.resizeGui\\(\\)", ".resizeDisplay()", NIE, ".resizeGui()")
		}
		/* Bild-im-Bild-Zeichner: 26.2-Form (ohne Puffer, mit Sammler) ueber src/compat/vor261 BildImBild. */
		regex(vor261) {
			replace("\\bextends PictureInPictureRenderer<", "extends mchorse.bbs_mod.compat.alt.BildImBild<", NIE, "extends PictureInPictureRenderer<")
		}
		regex(vor261) {
			replace("\\.gameRenderState\\(\\)\\.levelRenderState\\b", ".getLevelRenderState()", NIE, ".gameRenderState().levelRenderState")
		}
		regex(vor261) {
			replace("(?<![.\\w])ProjectionMatrixBuffer\\b", "PerspectiveProjectionMatrixBuffer", NIE, "ProjectionMatrixBuffer")
		}
		regex(vor261) {
			replace("\\bnew (?:net\\.minecraft\\.world\\.entity\\.)?EntitySpawnRequest\\(", "mchorse.bbs_mod.compat.alt.EntitySpawnRequest.grund(", NIE, "new EntitySpawnRequest(")
		}
		regex(vor261) {
			replace("\\bimport net\\.minecraft\\.world\\.entity\\.EntitySpawnRequest;", "import net.minecraft.world.entity.EntitySpawnReason;", NIE, "import net.minecraft.world.entity.EntitySpawnRequest;")
		}
		/* SpecialModelRenderer.Unbaked ist vor 26.1 nicht generisch. */
		regex(vor261) {
			replace("\\bSpecialModelRenderer\\.Unbaked<[\\w.?]+>", "SpecialModelRenderer.Unbaked", NIE, "SpecialModelRenderer.Unbaked")
		}
		regex(vor261) {
			replace("(?:com\\.mojang\\.blaze3d\\.buffers\\.)?\\bGpuBufferSlice\\.MappedView\\b", "mchorse.bbs_mod.compat.alt.MappedView", NIE, "GpuBufferSlice.MappedView")
		}
		/* 26.2 loescht die Tiefe umgekehrt auf 0; die Schicht spiegelt Loeschwerte (CommandEncoderAlt). */
		regex(vor261) {
			replace("(?:com\\.mojang\\.blaze3d\\.systems\\.)?\\bRenderSystem\\.DEFAULT_DEPTH_CLEAR_VALUE\\b", "0.0D", NIE, "RenderSystem.DEFAULT_DEPTH_CLEAR_VALUE")
		}
		regex(vor261) {
			replace("\\.entityTags\\(\\)", ".getTags()", NIE, ".entityTags()")
		}
		regex(vor261) {
			replace("\\.addGuiElement\\(", ".submitGuiElement(", NIE, ".addGuiElement(")
		}
		regex(vor261) {
			replace("\\.addPicturesInPictureState\\(", ".submitPicturesInPictureState(", NIE, ".addPicturesInPictureState(")
		}
		regex(vor261) {
			replace("(?:net\\.minecraft\\.client\\.resources\\.model\\.sprite\\.)?\\bMaterial\\.Baked\\b", "mchorse.bbs_mod.compat.alt.MaterialBaked", NIE, "Material.Baked")
		}
		regex(vor261) {
			replace("\\.getLightDampening\\(\\)", ".getLightBlock()", NIE, ".getLightDampening()")
		}
		regex(vor261) {
			replace("\\.gui(?:\\.hud)?\\.extractRenderState\\(", ".gui.render(", NIE, ".gui.extractRenderState(")
		}
		/* Abschnittsgeometrie neu bauen: vor 26.1 LevelRenderer.allChanged() (ohne Parameter). */
		regex(vor261) {
			replace("\\.invalidateCompiledGeometry\\([^;]*\\);", ".allChanged();", NIE, ".invalidateCompiledGeometry();")
		}
		/* Farbige Blocksaetze: 26.x Blocks.WOOL.white(), davor Blocks.WHITE_WOOL usw. */
		def farben = ["white", "orange", "magenta", "lightBlue", "yellow", "lime", "pink", "gray", "lightGray",
			"cyan", "purple", "blue", "brown", "green", "red", "black"]
		[["WOOL", "WOOL"], ["DYED_TERRACOTTA", "TERRACOTTA"], ["CONCRETE", "CONCRETE"]].each { satz ->
			farben.each { farbe ->
				def gross = farbe.replaceAll(/([A-Z])/, '_$1').toUpperCase()
				regex(vor261) {
					replace("\\bBlocks\\." + satz[0] + "\\." + farbe + "\\(\\)", "Blocks." + gross + "_" + satz[1], NIE, "Blocks." + satz[0] + "." + farbe + "()")
				}
			}
		}
		regex(vor261) {
			replace("\\.getDefaultClockTime\\(\\)", ".getDayTime()", NIE, ".getDefaultClockTime()")
		}
		/* Minecraft.renderFrame(boolean) heisst vor 26.1 runTick(boolean). */
		regex(vor261) {
			replace("method = \"renderFrame\"", "method = \"runTick\"", NIE, "method = \"renderFrame\"")
		}
		/* Grafik-Abbau: vor 26.1 schliesst Minecraft.close das Geraet direkt (kein shutdownRenderer). */
		regex(vor261) {
			replace("Lcom/mojang/blaze3d/systems/RenderSystem;shutdownRenderer\\(\\)V", "Lcom/mojang/blaze3d/systems/GpuDevice;close()V", NIE, "Lcom/mojang/blaze3d/systems/RenderSystem;shutdownRenderer()V")
		}
		regex(vor261) {
			replace("\\(\\(mchorse\\.bbs_mod\\.mixin\\.client\\.GuiRenderStateAccessor\\) mc\\.gui\\)", "((mchorse.bbs_mod.mixin.client.GuiRenderStateAccessor) mc.gameRenderer)", NIE, "((mchorse.bbs_mod.mixin.client.GuiRenderStateAccessor) mc.gui)")
		}
	}
}