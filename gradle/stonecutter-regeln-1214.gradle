		 ["\\bServerLevel (\\w+) = (\\w+)\\.level\\(\\);", "ServerLevel \$1 = \$2.serverLevel();"],
		 ["getInventory\\(\\)\\.setSelectedSlot\\((.+)\\);", "getInventory().selected = \$1;"],
		 ["\\.getCompoundOrEmpty\\(", ".getCompound("],
		 /* ResourceKey.identifier() hiess location(). */
		 ["\\.identifier\\(\\)", ".location()"],
		 ["\\bimport net\\.minecraft\\.world\\.item\\.component\\.TypedEntityData;", "import net.minecraft.world.item.component.CustomData;"],
		 /* Blockdaten am Gegenstand: vor 1.21.9 CustomData mit "id" im Tag statt TypedEntityData. */
		 ["(?:\\bnet\\.minecraft\\.world\\.item\\.component\\.)?\\bTypedEntityData<(?:net\\.minecraft\\.world\\.level\\.block\\.entity\\.)?BlockEntityType<\\?>>", "net.minecraft.world.item.component.CustomData"],
		 ["\\bTypedEntityData\\.of\\((\\w+)\\.getType\\(\\), \\1\\.saveCustomOnly\\(([^()]*\\(\\))\\)\\)", "CustomData.of(\$1.saveWithId(\$2))"],
		 ["\\.copyTagWithoutId\\(\\)", ".copyTag()"],
		 ["\\bTypedEntityData\\.of\\(BBSMod\\.MODEL_BLOCK_ENTITY, (\\w+)\\)", "CustomData.of(\$1)"],
		 /* ServerPlayer.level() liefert erst ab 1.21.6 eine ServerLevel. */
		 ["((?:\\.play|sendPlayFilm)\\(player, )player\\.level\\(\\)", "\$1player.serverLevel()"]].each { regel ->
			regex(vor12111) {
				replace(regel[0], regel[1], NIE, regel[1])
			}
		}
	}
}
