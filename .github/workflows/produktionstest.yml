# Starts the released jar in a real production environment on Windows and Linux and runs
# the client gametest in it: world creation, BBS dashboard, screenshot. GitHub's runners
# have no GPU, so OpenGL comes from Mesa's software renderer (llvmpipe) on both systems.
name: Produktionstest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  produktionstest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Mesa OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Xvfb and Mesa (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils

      - name: Build
        run: ./gradlew build -x test

      - name: Prepare isolated Windows crash diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/windows-native-crash.ps1 prepare

      - name: Production run with client gametest (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 6
        env:
          GALLIUM_DRIVER: llvmpipe
        run: ./gradlew -I .github/produktionstest.gradle produktionstest

      - name: Production run with client gametest (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
          # Minecraft 26.3 requests sRGB, which Xvfb's GLX visuals do not provide.
          # SDL's native EGL context path keeps the actual OpenGL renderer.
          SDL_VIDEO_FORCE_EGL: '1'
          BBS_EXPORT_NATIVE_WORLD: ${{ github.workspace }}/build/production-diagnostics/native-fixture-world
        run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' bash .github/produktionstest-linux.sh

      - name: Collect Windows native failure evidence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/windows-native-crash.ps1 collect

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produktionstest-${{ runner.os }}
          path: |
            build/libs/bbs-*.jar
            build/produktionstest/logs/
            build/produktionstest/crash-reports/
            build/produktionstest/screenshots/
            build/production-diagnostics/
            build/produktionstest/**/screenshots/
          if-no-files-found: warn

  frozen-windows:
    name: Linux artifact on Windows
    needs: produktionstest
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ssciwr/setup-mesa-dist-win@v3
      - name: Download the exact Linux runtime inputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: produktionstest-Linux
          path: build/frozen-linux
      - name: Prepare isolated Windows crash diagnostics
        shell: pwsh
        run: ./.github/windows-native-crash.ps1 prepare
      - name: Test the unchanged Linux product and test mod
        timeout-minutes: 6
        env:
          BBS_PRODUCTION_MOD_DIR: build/frozen-linux/libs
          GALLIUM_DRIVER: llvmpipe
        run: ./gradlew --console=plain --init-script=.github/produktionstest.gradle produktionstest
      - name: Collect Windows native failure evidence
        if: always()
        shell: pwsh
        run: ./.github/windows-native-crash.ps1 collect
      - name: Upload frozen-input runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produktionstest-Frozen-Windows
          path: |
            build/production-diagnostics/
            build/produktionstest/logs/
            build/produktionstest/crash-reports/
            build/produktionstest/**/screenshots/
          if-no-files-found: warn
