# Starts the released jar in a real production environment on Windows and Linux and runs
# the client gametest in it: world creation, BBS dashboard, screenshot. GitHub's runners
# have no GPU, so OpenGL comes from Mesa's software renderer (llvmpipe) on both systems.
name: Produktionstest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  produktionstest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Mesa OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Xvfb and Mesa (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Build
        run: ./gradlew build -x test

      - name: Production run with client gametest (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 6
        env:
          GALLIUM_DRIVER: llvmpipe
        run: ./gradlew -I .github/produktionstest.gradle produktionstest

      - name: Production run with client gametest (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' bash .github/produktionstest-linux.sh

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produktionstest-${{ runner.os }}
          path: |
            build/produktionstest/logs/
            build/produktionstest/crash-reports/
            build/produktionstest/screenshots/
            build/produktionstest/diagnostics/
            build/produktionstest/**/screenshots/
          if-no-files-found: warn
