# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Der laufende client haelt SEINEN daemon dauerhaft BUSY (runClient laeuft ja weiter).
# Jeder compile braucht darum einen ZWEITEN. Ohne langen idle-timeout stirbt der zwischen
# zwei aenderungen weg und der naechste compile startet KALT: volle loom-konfiguration,
# minuten ohne ausgabe — das sah dreimal wie ein haenger aus und wurde dreimal abgebrochen.
# 8 stunden halten den zweiten daemon ueber eine ganze sitzung warm.
org.gradle.daemon.idletimeout=28800000

