# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Der laufende client haelt SEINEN daemon dauerhaft BUSY (runClient laeuft ja weiter).
# Jeder compile braucht darum einen ZWEITEN. Ohne langen idle-timeout stirbt der zwischen
# zwei aenderungen weg und der naechste compile startet KALT: volle loom-konfiguration,
# minuten ohne ausgabe — das sah dreimal wie ein haenger aus und wurde dreimal abgebrochen.
# 8 stunden halten den zweiten daemon ueber eine ganze sitzung warm.
org.gradle.daemon.idletimeout=28800000

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
yarn_mappings=1.21.1+build.3
loader_version=0.19.5

# Mod Properties
mod_version=2.5.0
maven_group=mchorse
archives_base_name=bbs

# Dependencies
fabric_version=0.160.7+26.3


# ⛔ GRADLE SELBST AUF JAVA 25 (P3 des 26.2-ports, 2026-07-30).
#
# Erster versuch war eine TOOLCHAIN — gradle auf 21 lassen und nur den compiler wechseln,
# um die loom-caches zu schonen (davor warnt der kommentar in build.gradle seit 2026-07-27).
# Das geht nicht: loom prueft die GRADLE-JVM, nicht den compiler, und bricht ab mit
#     Failed to setup Minecraft: Minecraft 26.2 requires Java 25 but Gradle is using 21
#
# Der cache-verlust, den die alte warnung vermeiden wollte, ist hier ohnehin gegenstandslos:
# mit dem wechsel von 1.21.1 auf 26.2 sind mappings und remap-ergebnisse sowieso ungueltig.
#
# ⛔ NUR AUF DIESEM ZWEIG. Der zweig `1.21.1` hat seine eigene gradle.properties und baut
# weiter mit Java 21 — die CF-instanz des users haengt daran.
# Pfad auf linux umgestellt (2026-08-07). Die JBR ist JBRSDK-25.0.3+9-508.16-nomod —
# derselbe build wie unter windows, nur linux-x64, geprueft ueber die sha512 von jetbrains.
# Sie hat lib/hotswap/hotswap-agent.jar 2.0.4-SNAPSHOT: das ist die ERSTE fassung mit
# "supported in new JBR21/25". Die 2.0.3, die auf C: liegt, kannte JBR 25 noch nicht.
